<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="week.1.title">Week 1 — Athlete</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/i18n.js" defer></script>
  <style>
    :root { --week-color:#f28b18; --week-dark:#bd6205; }
    body.week-home {
      min-height:100svh; overflow-x:hidden;
      background:linear-gradient(180deg,#9cddff 0%,#d7f6f4 62%,#e9fff3 100%);
    }
    body.week-home::after {
      content:""; position:fixed; z-index:-1; left:-8vw; bottom:-14vw;
      width:52vw; height:28vw; border:clamp(8px,1vw,16px) solid rgba(255,255,255,.28);
      border-right:0; border-bottom:0; border-radius:100% 0 0 0; transform:rotate(8deg);
    }
    .week-home-shell { width:min(1240px,100%); margin:auto; padding:clamp(10px,2svh,22px) 0 24px; text-align:center; }
    .week-heading { padding:0 72px; }
    .week-heading h1 {
      margin:0; color:var(--week-color); font-size:clamp(2rem,min(6vw,6svh),4rem); line-height:1.05;
      text-shadow:3px 3px #fff,7px 7px rgba(189,98,5,.18);
    }
    .week-heading p { margin:8px 0 12px; color:#18579f; font-size:clamp(1rem,2.4vw,1.4rem); font-weight:800; }
    .carousel-wrap { position:relative; padding:6px 60px 12px; }
    .learning-carousel {
      display:flex; gap:26px; overflow-x:auto; padding:12px max(10px,calc(50% - 205px)) 22px;
      scroll-snap-type:x mandatory; scroll-behavior:smooth; scrollbar-width:none;
    }
    .learning-carousel::-webkit-scrollbar { display:none; }
    .learning-card {
      --card:#7750d6; --card-light:#a986f2; --card-dark:#5231a5;
      position:relative; flex:0 0 min(350px,78vw); min-height:clamp(300px,43svh,390px); overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:10px;
      padding:clamp(16px,2.6svh,24px) 22px 18px; border:8px solid #fff; border-radius:42px;
      color:#fff; text-decoration:none; scroll-snap-align:center;
      background:linear-gradient(145deg,var(--card-light),var(--card) 45%,var(--card-dark));
      box-shadow:0 12px 0 color-mix(in srgb,var(--card-dark) 88%,#222),0 22px 30px rgba(30,58,95,.22);
      transform:scale(.9); opacity:.78; transition:transform .28s ease,opacity .28s ease,filter .2s ease;
    }
    .learning-card::before { content:""; position:absolute; inset:7px 8px 54% 8px; border-radius:28px 28px 50% 50%; background:linear-gradient(rgba(255,255,255,.32),transparent); pointer-events:none; }
    .learning-card.is-active { transform:scale(1); opacity:1; }
    .learning-card:hover { filter:brightness(1.05); }
    .learning-card.reading { --card:#f14f50; --card-light:#ff8882; --card-dark:#bd3038; }
    .learning-card.phonics { --card:#f7c52d; --card-light:#ffe269; --card-dark:#d59400; }
    .learning-card.games { --card:#65c943; --card-light:#9be879; --card-dark:#378f27; }
    .learning-card h2 { position:relative; z-index:1; margin:0; font-size:clamp(1.7rem,min(4vw,4.5svh),2.5rem); color:#fff; text-shadow:0 4px 0 rgba(59,42,82,.28); }
    .learning-card img { position:relative; z-index:1; width:min(250px,62vw); height:clamp(190px,30svh,250px); object-fit:contain; filter:drop-shadow(0 12px 8px rgba(38,36,55,.24)); }
    .learning-card.phonics .phonics-art { position:relative; z-index:1; display:grid; place-items:center; width:100%; height:270px; }
    .learning-card.phonics .phonics-art img { grid-area:1/1; }
    .phonics-letter { grid-area:1/1; z-index:2; margin:80px 0 0 142px; font-size:7rem; line-height:1; color:#ef4c3d; text-shadow:0 6px 0 #a92e25,3px 0 #fff,-3px 0 #fff; }
    .carousel-arrow { position:absolute; z-index:4; top:50%; width:58px; height:58px; border:5px solid #fff; border-radius:50%; background:#fff; color:#176ac2; box-shadow:0 6px 0 #b6d6e8,0 9px 16px rgba(30,58,95,.2); font-size:2rem; font-weight:900; cursor:pointer; transform:translateY(-50%); }
    .carousel-arrow:hover { transform:translateY(calc(-50% - 3px)); }
    .carousel-arrow.prev { left:8px; } .carousel-arrow.next { right:8px; }
    .carousel-dots { display:flex; justify-content:center; gap:13px; }
    .carousel-dot { width:38px; height:38px; padding:9px; border:3px solid transparent; border-radius:50%; background:#fff; background-clip:content-box; box-shadow:0 2px 5px rgba(90,60,18,.22); cursor:pointer; }
    .carousel-dot.is-active { background:var(--week-color); background-clip:content-box; transform:scale(1.08); }
    .all-weeks-btn {
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      margin:14px auto 0; min-width:200px; min-height:54px; padding:9px 24px;
      border:5px solid #fff; border-radius:999px; background:linear-gradient(180deg,#ffbd52,var(--week-color));
      color:#fff; text-decoration:none; font-size:1.2rem; font-weight:900;
      box-shadow:0 7px 0 var(--week-dark),0 12px 18px rgba(30,58,95,.18);
      transition:transform .16s ease,filter .16s ease;
    }
    .all-weeks-btn:hover { transform:translateY(-3px); filter:brightness(1.04); }
    .all-weeks-btn:active { transform:translateY(4px); box-shadow:0 3px 0 var(--week-dark); }
    @media (max-width:650px) {
      .week-home-shell { padding-top:8px; }
      .week-heading { padding:0 24px; }
      .carousel-wrap { padding-inline:32px; }
      .learning-carousel { gap:18px; padding-inline:max(5px,calc(50% - min(170px,39vw))); }
      .learning-card { flex-basis:min(330px,78vw); min-height:clamp(300px,48svh,370px); }
      .learning-card img,.learning-card.phonics .phonics-art { height:clamp(190px,32svh,230px); }
      .carousel-arrow { width:48px; height:48px; font-size:1.6rem; }
      .carousel-arrow.prev { left:2px; } .carousel-arrow.next { right:2px; }
    }
    @media (prefers-reduced-motion:reduce) { .learning-carousel { scroll-behavior:auto; } .learning-card { transition:none; } }
  </style>
</head>
<body class="week-home">
  <main class="week-home-shell">
    <header class="week-heading">
      <h1 data-i18n="week.1.heading">Week 1 — Athlete!</h1>
      <p data-i18n="week.1.topic">What sport do you play?</p>
    </header>
    <div class="carousel-wrap" id="lesson-focus">
      <button class="carousel-arrow prev" type="button" aria-label="Previous choice" data-i18n-aria-label="nav.previous">‹</button>
      <nav class="learning-carousel" aria-label="Week 1 learning choices" data-i18n-aria-label="week.1.choices">
        <a class="learning-card literacy is-active" href="lessons/page-01.html" data-card="0"><h2 data-i18n="category.literacy">Literacy</h2><img src="assets/images/ui/week-home/literacy-guide.png" alt="GP Friend reading a letter book" data-i18n-alt="image.literacy"></a>
        <a class="learning-card reading" href="reading/week-1.html" data-card="1"><h2 data-i18n="category.reading">Reading</h2><img src="assets/images/ui/week-home/reading-guide.png" alt="GP Friend reading a sports story" data-i18n-alt="image.reading"></a>
        <a class="learning-card phonics" href="phonics/week-1.html" data-card="2"><h2 data-i18n="category.phonics">Phonics</h2><img src="assets/images/ui/week-home/phonics-guide.png" alt="Koala GP Friend holding the letter A" data-i18n-alt="image.phonicsA"></a>
        <a class="learning-card games" href="games/index.html?week=1" data-card="3"><h2 data-i18n="category.games">Games</h2><img src="assets/images/ui/week-home/games-guide.png" alt="Beaver GP Friend holding a game controller" data-i18n-alt="image.games"></a>
      </nav>
      <button class="carousel-arrow next" type="button" aria-label="Next choice" data-i18n-aria-label="nav.next">›</button>
    </div>
    <div class="carousel-dots" aria-label="Carousel position" data-i18n-aria-label="nav.carouselPosition">
      <button class="carousel-dot is-active" data-card="0" aria-label="Show Literacy" data-i18n-aria-label="nav.showLiteracy"></button>
      <button class="carousel-dot" data-card="1" aria-label="Show Reading" data-i18n-aria-label="nav.showReading"></button>
      <button class="carousel-dot" data-card="2" aria-label="Show Phonics" data-i18n-aria-label="nav.showPhonics"></button>
      <button class="carousel-dot" data-card="3" aria-label="Show Games" data-i18n-aria-label="nav.showGames"></button>
    </div>
    <a class="all-weeks-btn" href="index.html" data-i18n="nav.allWeeks">⬅️ All Weeks</a>
  </main>
  <script src="js/main.js"></script>
  <script>
    (() => {
      const track = document.querySelector('.learning-carousel');
      const cards = [...document.querySelectorAll('.learning-card')];
      const dots = [...document.querySelectorAll('.carousel-dot')];
      const returnCards = {
        '#card-literacy': 0,
        '#card-reading': 1,
        '#card-phonics': 2,
        '#card-games': 3
      };
      let active = returnCards[window.location.hash] ?? 0;
      const show = (index) => {
        active = Math.max(0, Math.min(cards.length - 1, index));
        cards.forEach((card, i) => card.classList.toggle('is-active', i === active));
        dots.forEach((dot, i) => dot.classList.toggle('is-active', i === active));
        cards[active].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest', inline: 'center' });
      };
      document.querySelector('.carousel-arrow.prev').addEventListener('click', () => show(active - 1));
      document.querySelector('.carousel-arrow.next').addEventListener('click', () => show(active + 1));
      dots.forEach((dot, i) => dot.addEventListener('click', () => show(i)));
      let timer;
      track.addEventListener('scroll', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const middle = track.getBoundingClientRect().left + track.clientWidth / 2;
          const closest = cards.reduce((best, card, i) => Math.abs(card.getBoundingClientRect().left + card.offsetWidth / 2 - middle) < best.distance ? { i, distance:Math.abs(card.getBoundingClientRect().left + card.offsetWidth / 2 - middle) } : best, { i:active, distance:Infinity });
          active = closest.i;
          cards.forEach((card, i) => card.classList.toggle('is-active', i === active));
          dots.forEach((dot, i) => dot.classList.toggle('is-active', i === active));
        }, 90);
      }, { passive:true });
      addEventListener('load', () => {
        show(active);
      }, { once:true });
    })();
  </script>
</body>
</html>
