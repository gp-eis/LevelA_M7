<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete People 🏅</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Landing-page-only styling */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 214, 74, .55), transparent 55%),
        linear-gradient(180deg, #7ed0ff 0%, #b8e8ff 42%, #e8fff4 100%);
    }

    .hero {
      width: min(920px, 94vw);
      text-align: center;
      padding: 104px 20px 60px;
      position: relative;
      z-index: 2;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 22px);
    }

    .title-row .title-mark {
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      line-height: 1;
      filter: drop-shadow(0 6px 5px rgba(30, 58, 95, .18));
      animation: medal-bounce 2.6s ease-in-out infinite;
    }

    .title-row .title-mark:last-child { animation-delay: .35s; }

    @keyframes medal-bounce {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-6px) rotate(4deg); }
    }

    .hero .big-title {
      font-size: clamp(2.45rem, 6.2vw, 4rem);
      line-height: 1.05;
      color: #1e6fd9;
      text-shadow: 3px 3px 0 var(--white), 7px 7px 0 rgba(30, 111, 217, .18);
    }

    .hero .subtitle {
      margin-top: 28px;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      color: #0f8a62;
    }

    .athletes-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.7vw, 22px);
      margin: 22px auto 0;
      max-width: 900px;
    }

    .athlete-icon {
      width: min(17.5%, 120px);
      height: 120px;
      display: grid;
      place-items: center;
      font-size: clamp(3.2rem, 8vw, 4.6rem);
      filter: drop-shadow(0 8px 6px rgba(30, 58, 95, .14));
      animation: athlete-bob 2.8s ease-in-out infinite;
    }

    .athlete-icon:nth-child(2) { animation-delay: .25s; }
    .athlete-icon:nth-child(3) { animation-delay: .5s; }
    .athlete-icon:nth-child(4) { animation-delay: .75s; }
    .athlete-icon:nth-child(5) { animation-delay: 1s; }

    @keyframes athlete-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .menu-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      margin-top: 28px;
    }

    .menu-buttons .big-btn {
      width: min(274px, 40vw);
      min-height: 91px;
      padding: 20px 32px;
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    .sun {
      position: fixed;
      top: 36px;
      right: 10%;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7b0, #ffd93d 55%, #ffb703);
      box-shadow: 0 0 0 10px rgba(255, 217, 61, .28);
      z-index: 1;
    }

    .cloud {
      position: fixed;
      background: var(--white);
      border-radius: 999px;
      opacity: .85;
      z-index: 1;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: var(--white);
      border-radius: 50%;
    }

    .cloud.c1 {
      top: 48px;
      left: 28%;
      width: 140px;
      height: 46px;
      transform: translateX(-50%);
    }

    .cloud.c1::before { width: 64px; height: 64px; top: -30px; left: 20px; }
    .cloud.c1::after  { width: 50px; height: 50px; top: -20px; left: 74px; }
    .cloud.c2 { display: none; }

    @media (max-width: 650px) {
      .hero { padding-top: 90px; }
      .title-row .title-mark { display: none; }
      .athletes-row { gap: 2px; }
      .athlete-icon { width: 19.5%; height: 88px; font-size: 2.8rem; }
      .menu-buttons { gap: 20px; margin-top: 34px; }
      .menu-buttons .big-btn {
        width: min(330px, 86vw);
        min-height: 78px;
      }
      .cloud.c1 { left: 50%; transform: translateX(-50%) scale(.8); }
      .sun { right: 6%; width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="floaties" aria-hidden="true">
    <span style="top:8%;  left:6%;">⚽</span>
    <span style="top:22%; left:88%;">🏀</span>
    <span style="top:55%; left:4%;">🏃</span>
    <span style="top:70%; left:92%;">🎾</span>
    <span style="top:85%; left:12%;">⭐</span>
    <span style="top:40%; left:80%;">🏆</span>
    <span style="top:90%; left:70%;">🏅</span>
  </div>

  <main class="hero">
    <div class="title-row">
      <span class="title-mark" aria-hidden="true">🏅</span>
      <h1 class="big-title">Athlete People!</h1>
      <span class="title-mark" aria-hidden="true">🏆</span>
    </div>
    <p class="subtitle">Let's run, jump, and cheer for every sport star! ✨</p>

    <div class="athletes-row" aria-hidden="true">
      <span class="athlete-icon">🏃</span>
      <span class="athlete-icon">⚽</span>
      <span class="athlete-icon">🏀</span>
      <span class="athlete-icon">🎾</span>
      <span class="athlete-icon">🏊</span>
    </div>

    <nav class="menu-buttons" aria-label="Main menu">
      <a class="big-btn btn-pink" href="lessons/index.html">📖 Literacy</a>
      <a class="big-btn btn-blue" href="reading/index.html">📚 Reading</a>
      <a class="big-btn btn-green" href="games/index.html">🎮 Games</a>
    </nav>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
