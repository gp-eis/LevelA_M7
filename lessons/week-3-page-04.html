<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Literacy Week 3 — Page 5 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-3-page-05.css?v=20260827-4">
</head>
<body class="week-3-words-body">
  <main class="page literacy-activity-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-3-page-03.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 5 of 6</span>
      <a class="back-link next-page-link" href="week-3-page-05.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-3.html#card-literacy">🏠 Week 3 Home</a>

    <header class="center" style="margin-top:16px">
      <h1 class="big-title week-3-words-title" style="font-size:2.4rem">Week 3 — Where are we?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=3">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=3">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card week-3-words-card" aria-label="Complete the Olympic Games sentence">
      <div class="week-3-words-stage">
        <img class="week-3-words-picture" src="../assets/images/week-3/literacy/page-05-background.webp" width="1412" height="1114" alt="Children watching the Olympic Games with seven word choices.">
        <video id="week-3-words-question-video" class="week-3-words-character-video" playsinline preload="auto" aria-label="Children asking what are you watching"></video>
        <button id="week-3-words-question-speaker" class="week-3-words-question-speaker" type="button" aria-label="Replay the question" disabled>🔊</button>

        <div class="week-3-sentence-progress" aria-live="polite" aria-label="It’s the Olympic Games">
          <span data-step="0">the</span>
          <span data-step="1">Olympic</span>
          <span data-step="2">Games</span>
        </div>

        <svg class="week-3-word-path" aria-hidden="true"><polyline id="week-3-word-path-line" points=""></polyline></svg>

        <div class="week-3-word-bank" role="group" aria-label="Choose words in order">
          <button class="word-choice word-blue" type="button" data-word="the" data-audio="../assets/audio/week-3/literacy/page-05-sports.mp3">the</button>
          <button class="word-choice word-green" type="button" data-word="sports" data-audio="../assets/audio/week-3/literacy/page-05-the.mp3">sports</button>
          <button class="word-choice word-sky" type="button" data-word="games" data-audio="../assets/audio/week-3/literacy/page-05-games.mp3">Games</button>
          <button class="word-choice word-sky" type="button" data-word="olympic" data-audio="../assets/audio/week-3/literacy/page-05-olympic.mp3">Olympic</button>
          <button class="word-choice word-red" type="button" data-word="a" data-audio="../assets/audio/week-3/literacy/page-05-a.mp3">a</button>
          <button class="word-choice word-purple" type="button" data-word="tennis" data-audio="../assets/audio/week-3/literacy/page-05-tennis.mp3">tennis</button>
          <button class="word-choice word-orange" type="button" data-word="soccer" data-audio="../assets/audio/week-3/literacy/page-05-soccer.mp3">soccer</button>
        </div>

        <div id="week-3-words-start" class="week-3-words-start"><button id="week-3-words-start-button" class="week-3-words-start-button" type="button">▶ Start Activity</button></div>

        <div id="week-3-words-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame week-3-words-completion-frame">
            <button id="week-3-words-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="week-3-words-good-job-video" class="activity-completion-video" src="../assets/video/shared/wohoo-you-did-it.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="week-3-words-completion-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <p id="week-3-words-status" class="week-3-words-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
      <button id="week-3-words-restart" class="pill-btn blue week-3-words-restart" type="button">↻ Try Again</button>
    </section>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-3-page-05.js"></script>
</body>
</html>
