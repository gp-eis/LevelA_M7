<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Song — Literacy — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .tpr-note {
      margin-top: 14px;
      font-family: var(--font-friendly);
      font-weight: 600;
      font-size: 1.05rem;
      color: #3d5a78;
      text-align: center;
    }

    .week-song-video {
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🤸</span>
    <span style="top:70%; left:94%;">⭐</span>
  </div>

  <div class="page">
    <a class="back-link" id="back-week" href="../week-1.html#card-literacy">⬅️ Week 1 Home</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/gp-runner-3d.webp" alt="">Week Song</h1>
      <p class="subtitle" id="week-label">Sing and move along!</p>
    </header>

    <div id="tpr-ready" style="display:none;">
      <section class="card" style="margin-top:24px;">
        <div class="video-play-shell">
          <video
            id="dialogue-video"
            class="lesson-video week-song-video"
            controls
            playsinline
            preload="metadata"
            aria-label="Week Song video"
          ></video>
          <button
            class="center-video-play"
            type="button"
            aria-label="Play the Week Song"
          >&#9654;</button>
        </div>
      </section>
    </div>

    <div id="tpr-soon" class="card center" style="margin-top:24px; display:none;">
      <h2 class="section-title">✨ Coming Soon</h2>
      <p class="tpr-note">The Week Song for this week will appear here once it is ready.</p>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const week = new URLSearchParams(location.search).get('week') || '1';
    const titles = {
      1: 'Week 1 — What sport do you play?',
      2: 'Week 2 — What do you practice?',
      3: 'Week 3 — Where are we?',
      4: 'Week 4 — When are the Olympic Games?'
    };
    const songs = {
      1: {
        src: '../assets/video/week-1/TPR/week-1-song.mp4'
      },
      2: {
        src: '../assets/video/week-2/TPR/what-do-you-practice-talk-song.mp4'
      },
      3: {
        src: '../assets/video/week-3/TPR/where-are-we-talk-song.mp4?v=20260828-1'
      },
      4: {
        src: '../assets/video/week-4/TPR/when-are-the-olympic-games-talk-song.mp4'
      }
    };
    const back = document.getElementById('back-week');
    const label = document.getElementById('week-label');
    const returnLink = typeof resolveLiteracyToolReturn === 'function'
      ? resolveLiteracyToolReturn('page-0' + week + '.html', '⬅️ Week ' + week)
      : { href: 'page-0' + week + '.html', text: '⬅️ Week ' + week };
    back.href = returnLink.href;
    back.textContent = returnLink.text;
    label.textContent = titles[week] || ('Week ' + week);
    document.title = 'Week Song — Week ' + week + ' — Athlete';

    const song = songs[week];
    if (song) {
      const video = document.getElementById('dialogue-video');
      const playButton = document.querySelector('#tpr-ready .center-video-play');
      video.src = song.src;
      video.setAttribute('aria-label', `Week ${week} song video`);
      playButton.setAttribute('aria-label', `Play the Week ${week} song`);
      document.getElementById('tpr-ready').style.display = '';
    } else {
      document.getElementById('tpr-soon').style.display = '';
    }
  </script>
</body>
</html>
