<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Literacy Week 3 — Page 4 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-3-page-04.css">
</head>
<body class="week-3-sports-body">
  <main class="page literacy-activity-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-3-page-02.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 4 of 6</span>
      <a class="back-link next-page-link" href="week-3-page-04.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-3.html#card-literacy">🏠 Week 3 Home</a>

    <header class="center" style="margin-top:16px">
      <h1 class="big-title week-3-sports-title" style="font-size:2.4rem">Week 3 — Where are we?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=3">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=3">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card week-3-sports-card" aria-label="Circle the Olympic sports activity">
      <div class="week-3-sports-stage">
        <img class="week-3-sports-picture" src="../assets/images/week-3/literacy/page-04-background.webp" width="1412" height="1114" alt="Six pictures: skating, cooking, jumping, running, swimming, and diving.">

        <div class="week-3-sports-hotspots" role="group" aria-label="Choose all sports at the Olympic Games">
          <div class="sport-hotspot skating" data-sport="skating" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-04-skating.mp3"><button class="sport-select" type="button" aria-label="Choose skating"></button><button class="sport-speaker" type="button" aria-label="Listen to skating">🔊</button></div>
          <div class="sport-hotspot cooking" data-sport="cooking" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-04-cooking.mp3"><button class="sport-select" type="button" aria-label="Choose cooking"></button><button class="sport-speaker" type="button" aria-label="Listen to cooking">🔊</button></div>
          <div class="sport-hotspot jumping" data-sport="jumping" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-04-jumping.mp3"><button class="sport-select" type="button" aria-label="Choose jumping"></button><button class="sport-speaker" type="button" aria-label="Listen to jumping">🔊</button></div>
          <div class="sport-hotspot running" data-sport="running" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-04-running.mp3"><button class="sport-select" type="button" aria-label="Choose running"></button><button class="sport-speaker" type="button" aria-label="Listen to running">🔊</button></div>
          <div class="sport-hotspot swimming" data-sport="swimming" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-04-swimming.mp3"><button class="sport-select" type="button" aria-label="Choose swimming"></button><button class="sport-speaker" type="button" aria-label="Listen to swimming">🔊</button></div>
          <div class="sport-hotspot diving" data-sport="diving" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-04-diving.mp3"><button class="sport-select" type="button" aria-label="Choose diving"></button><button class="sport-speaker" type="button" aria-label="Listen to diving">🔊</button></div>
        </div>

        <div id="week-3-sports-start" class="week-3-sports-start">
          <button id="week-3-sports-start-button" class="week-3-sports-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="week-3-sports-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame week-3-sports-completion-frame">
            <button id="week-3-sports-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="week-3-sports-good-job-video" class="activity-completion-video" src="../assets/video/shared/wohoo-you-did-it.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="week-3-sports-completion-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <p id="week-3-sports-status" class="week-3-sports-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
      <button id="week-3-sports-restart" class="pill-btn blue week-3-sports-restart" type="button">↻ Try Again</button>
    </section>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-3-page-04.js"></script>
</body>
</html>
