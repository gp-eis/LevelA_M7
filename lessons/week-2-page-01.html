<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literacy Week 2 — Page 2 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-2-practice-games.css">
</head>
<body>
  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🏃</span>
    <span style="top:70%; left:94%;">⭐</span>
  </div>

  <main class="page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="page-02.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 2 of 6</span>
      <a class="back-link next-page-link" href="week-2-page-02.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-2.html#card-literacy">🏠 Week 2 Home</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/gp-runner-3d.webp" alt="">Week 2 — What do you practice?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=2">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=2">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ Learning</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        playsinline
        preload="metadata"
        poster="../assets/images/week-2/literacy/page-02-thumbnail.png"
        aria-label="Week 2 practice video player"
      ></video>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">🎬 Tap to Watch!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn" type="button" data-dialogue data-practice-game="stretching" data-video="../assets/video/week-2/literacy/stretching.mp4" data-line="Stretching">
          <span aria-hidden="true">🎬</span> Stretching
        </button>
        <button class="pill-btn orange" type="button" data-dialogue data-practice-game="kicking" data-video="../assets/video/week-2/literacy/kicking.mp4" data-line="Kicking">
          <span aria-hidden="true">🎬</span> Kicking
        </button>
        <button class="pill-btn blue" type="button" data-dialogue data-practice-game="twisting" data-video="../assets/video/week-2/literacy/twisting.mp4" data-line="Twisting">
          <span aria-hidden="true">🎬</span> Twisting
        </button>
        <button class="pill-btn green" type="button" data-dialogue data-practice-game="running" data-video="../assets/video/week-2/literacy/running.mp4" data-line="Running">
          <span aria-hidden="true">🎬</span> Running
        </button>
        <button class="pill-btn orange" type="button" data-dialogue data-practice-game="jumping" data-video="../assets/video/week-2/literacy/jumping.mp4" data-line="Jumping">
          <span aria-hidden="true">🎬</span> Jumping
        </button>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/week-2-practice-games.js"></script>
</body>
</html>
