<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Literacy Week 3 — Page 6 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-3-page-06.css">
</head>
<body class="week-3-flags-body">
  <main class="page literacy-activity-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-3-page-04.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 6 of 6</span>
    </nav>
    <a class="literacy-list-link" href="../week-3.html#card-literacy">🏠 Week 3 Home</a>

    <header class="center">
      <h1 class="big-title week-3-flags-title" style="font-size:2.4rem">Week 3 — Where are we?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=3">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=3">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card week-3-flags-card" aria-label="Match each country to its flag">
      <div class="week-3-flags-stage">
        <img class="week-3-flags-background" src="../assets/images/week-3/literacy/page-06-background.webp" width="1412" height="1114" alt="Draw a line through the flag of each country.">
        <div class="week-3-flags-play-area" aria-hidden="true"></div>

        <div class="week-3-country-row" aria-label="Countries">
          <div class="country-label country-usa" data-country-label="usa">USA</div>
          <div class="country-label country-greece" data-country-label="greece">Greece</div>
          <div class="country-label country-brazil" data-country-label="brazil">Brazil</div>
          <div class="country-label country-uk" data-country-label="uk">UK</div>
          <div class="country-label country-australia" data-country-label="australia">Australia</div>
        </div>

        <svg class="week-3-flags-path" aria-hidden="true">
          <polyline id="week-3-flags-path-line" points=""></polyline>
          <circle class="path-dot path-dot-start" cx="0" cy="0" r="10"></circle>
          <circle class="path-dot path-dot-end" cx="0" cy="0" r="10"></circle>
        </svg>

        <div class="week-3-flags-grid" aria-label="Flag choices">
          <div class="flag-column" data-column="usa">
            <button class="flag-choice" type="button" data-country="usa" data-column="usa" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-06-usa.mp3" aria-label="USA flag"><img src="../assets/images/week-3/literacy/page-06-flag-usa.webp" alt="Flag of the USA"></button>
            <button class="flag-choice" type="button" data-country="mexico" data-column="usa" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-06-mexico.mp3" aria-label="Mexico flag"><img src="../assets/images/week-3/literacy/page-06-flag-mexico.webp" alt="Flag of Mexico"></button>
          </div>
          <div class="flag-column" data-column="greece">
            <button class="flag-choice" type="button" data-country="greece" data-column="greece" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-06-greece.mp3" aria-label="Greece flag"><img src="../assets/images/week-3/literacy/page-06-flag-greece.webp" alt="Flag of Greece"></button>
            <button class="flag-choice" type="button" data-country="germany" data-column="greece" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-06-germany.mp3" aria-label="Germany flag"><img src="../assets/images/week-3/literacy/page-06-flag-germany.webp" alt="Flag of Germany"></button>
          </div>
          <div class="flag-column" data-column="brazil">
            <button class="flag-choice" type="button" data-country="brazil" data-column="brazil" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-06-brazil.mp3" aria-label="Brazil flag"><img src="../assets/images/week-3/literacy/page-06-flag-brazil.webp" alt="Flag of Brazil"></button>
            <button class="flag-choice" type="button" data-country="south-korea" data-column="brazil" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-06-south-korea.mp3" aria-label="South Korea flag"><img src="../assets/images/week-3/literacy/page-06-flag-south-korea.webp" alt="Flag of South Korea"></button>
          </div>
          <div class="flag-column" data-column="uk">
            <button class="flag-choice" type="button" data-country="uk" data-column="uk" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-06-uk.mp3" aria-label="UK flag"><img src="../assets/images/week-3/literacy/page-06-flag-uk.webp" alt="Flag of the UK"></button>
            <button class="flag-choice" type="button" data-country="china" data-column="uk" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-06-china.mp3" aria-label="China flag"><img src="../assets/images/week-3/literacy/page-06-flag-china.webp" alt="Flag of China"></button>
          </div>
          <div class="flag-column" data-column="australia">
            <button class="flag-choice" type="button" data-country="australia" data-column="australia" data-correct="true" data-audio="../assets/audio/week-3/literacy/page-06-australia.mp3" aria-label="Australia flag"><img src="../assets/images/week-3/literacy/page-06-flag-australia.webp" alt="Flag of Australia"></button>
            <button class="flag-choice" type="button" data-country="france" data-column="australia" data-correct="false" data-audio="../assets/audio/week-3/literacy/page-06-france.mp3" aria-label="France flag"><img src="../assets/images/week-3/literacy/page-06-flag-france.webp" alt="Flag of France"></button>
          </div>
        </div>

        <button id="week-3-flags-replay" class="week-3-flags-replay" type="button" aria-label="Replay the current country" disabled>🔊</button>
        <span class="week-3-flags-page-number" aria-hidden="true">25</span>

        <div id="week-3-flags-start" class="week-3-flags-start">
          <button id="week-3-flags-start-button" class="week-3-flags-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="week-3-flags-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame week-3-flags-completion-frame">
            <button id="week-3-flags-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="week-3-flags-good-job-video" class="activity-completion-video" src="../assets/video/shared/wohoo-you-did-it.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="week-3-flags-completion-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <p id="week-3-flags-status" class="week-3-flags-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
      <button id="week-3-flags-restart" class="pill-btn blue week-3-flags-restart" type="button">↻ Try Again</button>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/week-3-page-06.js"></script>
</body>
</html>
