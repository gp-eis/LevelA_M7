<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literacy Week 1 — Athlete People</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .page-one-tools {
      margin-top: 20px;
    }

    .intro-video-card {
      margin-top: 24px;
      padding: clamp(12px, 2vw, 20px);
    }

    .intro-video-shell {
      position: relative;
      width: min(100%, 1080px);
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 26px;
      background: linear-gradient(145deg, #163e67, #111d35);
      box-shadow: 0 7px 18px rgba(38, 65, 103, .24);
    }

    .intro-video-shell .lesson-video {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      background: #111d35;
      box-shadow: none;
      object-fit: contain;
    }

    .intro-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      display: grid;
      place-items: center;
      width: clamp(88px, 11vw, 118px);
      height: clamp(88px, 11vw, 118px);
      padding: 0 0 0 8px;
      transform: translate(-50%, -50%);
      border: 7px solid #fff;
      border-radius: 50%;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.4), transparent 42%),
        linear-gradient(180deg, #ff9f4a, #f05d2d);
      box-shadow:
        0 10px 0 #b93e1d,
        0 17px 30px rgba(20,31,58,.42),
        inset 0 -7px 12px rgba(155,41,18,.2);
      font-family: inherit;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, opacity .18s ease;
    }

    .intro-play-button::before {
      content: '';
      position: absolute;
      inset: 8px 11px 56% 11px;
      border-radius: 999px 999px 55% 55%;
      background: linear-gradient(180deg, rgba(255,255,255,.52), rgba(255,255,255,0));
      pointer-events: none;
    }

    .intro-play-button span {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 3px 0 rgba(120,36,13,.32));
    }

    .intro-play-button:hover {
      transform: translate(-50%, calc(-50% - 5px)) scale(1.06);
      filter: brightness(1.06);
    }

    .intro-play-button:active {
      transform: translate(-50%, calc(-50% + 5px)) scale(.98);
      box-shadow: 0 5px 0 #b93e1d, 0 10px 22px rgba(20,31,58,.34);
    }

    .intro-play-button:focus-visible {
      outline: 6px solid var(--yellow);
      outline-offset: 5px;
    }

    .intro-play-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.72);
    }

    @media (max-width: 600px) {
      .intro-video-card { border-radius: 22px; }
      .intro-video-shell { border-radius: 18px; }
      .page-one-tools { margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-play-button { transition: none; }
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">⚽</span>
    <span style="top:70%; left:94%;">⭐</span>
  </div>

  <main class="page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="../week-1.html#card-literacy">⬅️ Week 1 Home</a>
      <span class="page-indicator" aria-current="page">📖 Page 1 of 6</span>
      <a class="back-link next-page-link" href="week-1-page-01.html#lesson-focus">Next Page ➡️</a>
    </nav>

    <nav class="week-tools page-one-tools" aria-label="Week tools">
      <a class="pill-btn orange" href="tpr.html?week=1">🤸 TPR</a>
      <a class="pill-btn blue" href="flashcards.html?week=1">🃏 Flashcards</a>
    </nav>

    <section id="lesson-focus" class="card intro-video-card" aria-label="Literacy Week 1 video">
      <div class="intro-video-shell">
        <video
          id="literacy-intro-video"
          class="lesson-video"
          controls
          playsinline
          preload="metadata"
          aria-label="Play the Week 1 literacy video"
        >
          <source src="../assets/video/week-1/Literacy-LevelA-M7-W1-Page1.mp4" type="video/mp4">
          Your browser does not support HTML video.
        </video>
        <button class="intro-play-button" id="intro-play-button" type="button" aria-label="Play the Week 1 literacy video">
          <span aria-hidden="true">▶</span>
        </button>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script>
    (() => {
      const video = document.getElementById('literacy-intro-video');
      const playButton = document.getElementById('intro-play-button');

      function showPlayButton() {
        playButton.classList.remove('is-hidden');
      }

      function hidePlayButton() {
        playButton.classList.add('is-hidden');
      }

      playButton.addEventListener('click', () => {
        video.play().then(hidePlayButton).catch(showPlayButton);
      });

      video.addEventListener('play', hidePlayButton);
      video.addEventListener('pause', showPlayButton);
      video.addEventListener('ended', showPlayButton);
    })();
  </script>
</body>
</html>
