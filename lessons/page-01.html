<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/styles.css">

<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">⚽</span>

  </div>

  <div class="page">
    <a class="back-link" href="index.html">⬅️ Literacy</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">🏃 Week 1 — What sport do you play?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=1">🤸 TPR</a>
        <a class="pill-btn blue" href="flashcards.html?week=1">🃏 Flashcards</a>
      </nav>
    </header>

    <!-- ============ LEARNING VIDEO ============ -->
    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ Learning</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="none"
        poster="../assets/images/week-1/learning-thumbnail.png"
        aria-label="Learning video for Week 1"
      ></video>
    </section>

    <!-- ============ DIALOGUE BUTTONS ============ -->
    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Hear!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-1/many-sports.mp4" data-line="Many sports">
          <span aria-hidden="true">🎬</span> Many sports
        </button>
        <button class="pill-btn orange" data-dialogue data-dress-up="soccer" data-video="../assets/video/week-1/soccer.mp4" data-line="Soccer">
          <span aria-hidden="true">🎬</span> Soccer
        </button>
        <button class="pill-btn blue" data-dialogue data-dress-up="tennis" data-video="../assets/video/week-1/tennis.mp4" data-line="Tennis">
          <span aria-hidden="true">🎬</span> Tennis
        </button>
        <button class="pill-btn green" data-dialogue data-dress-up="baseball" data-video="../assets/video/week-1/baseball.mp4" data-line="Baseball">
          <span aria-hidden="true">🎬</span> Baseball
        </button>
        <button class="pill-btn orange" data-dialogue data-dress-up="golf" data-video="../assets/video/week-1/golf.mp4" data-line="Golf">
          <span aria-hidden="true">🎬</span> Golf
        </button>
      </div>
    </section>

    <!-- ============ PAGE NAV ============ -->
    <nav class="page-nav">
      <span class="spacer"></span>
      <a class="pill-btn green" href="page-02.html">Next Week ➡️</a>
