<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literacy Week 4 — Page 5 — Countries</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-4-page-05.css">
</head>
<body>
  <main class="page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-4-page-03.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 5 of 6</span>
      <a class="back-link next-page-link" href="week-4-page-05.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-4.html#card-literacy">🏠 Week 4 Home</a>

    <header class="center">
      <h1 class="big-title" style="font-size:2.4rem">Week 4 — When are the Olympic Games?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=4">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=4">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card countries-activity-card" aria-label="Connect the letters to spell countries">
      <div class="countries-board">
        <img class="countries-board-image" src="../assets/images/week-4/literacy/page-05-countries.webp" width="1412" height="1114" alt="A globe made of flags surrounded by letter circles. Find the letters that spell countries.">
        <button id="countries-intro-replay" class="sentence-speaker board-instruction-speaker" type="button" aria-label="Listen to Find and circle the letters of the word again" disabled>🔊</button>
        <svg class="countries-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="countries-path-line" points=""></polyline></svg>

        <div class="countries-hotspots" role="group" aria-label="Choose the letters in countries, in order">
          <button class="letter-hotspot" style="--x:24.9%;--y:35.2%" type="button" data-letter="c" data-x="24.9" data-y="35.2" data-audio="../assets/audio/week-4/literacy/page-05/c.mp3" aria-label="Letter c" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:21.2%;--y:47%" type="button" data-letter="o" data-x="21.2" data-y="47" data-audio="../assets/audio/week-4/literacy/page-05/o.mp3" aria-label="Letter o" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:21.2%;--y:59.6%" type="button" data-letter="v" data-x="21.2" data-y="59.6" data-audio="../assets/audio/week-4/literacy/page-05/v.mp3" aria-label="Letter v" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:23.2%;--y:71.7%" type="button" data-letter="u" data-x="23.2" data-y="71.7" data-audio="../assets/audio/week-4/literacy/page-05/u.mp3" aria-label="Letter u" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:29.2%;--y:82.9%" type="button" data-letter="l" data-x="29.2" data-y="82.9" data-audio="../assets/audio/week-4/literacy/page-05/l.mp3" aria-label="Letter l" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:38.9%;--y:89.8%" type="button" data-letter="n" data-x="38.9" data-y="89.8" data-audio="../assets/audio/week-4/literacy/page-05/n.mp3" aria-label="Letter n" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:49.1%;--y:90.8%" type="button" data-letter="s" data-x="49.1" data-y="90.8" data-audio="../assets/audio/week-4/literacy/page-05/s-bottom.mp3" aria-label="Letter s" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:60.1%;--y:89.9%" type="button" data-letter="t" data-x="60.1" data-y="89.9" data-audio="../assets/audio/week-4/literacy/page-05/t.mp3" aria-label="Letter t" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:69.8%;--y:83.9%" type="button" data-letter="r" data-x="69.8" data-y="83.9" data-audio="../assets/audio/week-4/literacy/page-05/r.mp3" aria-label="Letter r" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:77.6%;--y:72.4%" type="button" data-letter="h" data-x="77.6" data-y="72.4" data-audio="../assets/audio/week-4/literacy/page-05/h.mp3" aria-label="Letter h" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:81.3%;--y:60.1%" type="button" data-letter="i" data-x="81.3" data-y="60.1" data-audio="../assets/audio/week-4/literacy/page-05/i.mp3" aria-label="Letter i" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:81.2%;--y:47.9%" type="button" data-letter="e" data-x="81.2" data-y="47.9" data-audio="../assets/audio/week-4/literacy/page-05/e.mp3" aria-label="Letter e" aria-pressed="false" disabled></button>
          <button class="letter-hotspot" style="--x:77%;--y:35.4%" type="button" data-letter="s" data-x="77" data-y="35.4" data-audio="../assets/audio/week-4/literacy/page-05/s-top.mp3" aria-label="Letter s" aria-pressed="false" disabled></button>
        </div>

        <div id="countries-start" class="countries-start">
          <button id="countries-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="countries-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame countries-completion-frame">
            <button id="countries-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="countries-good-job-video" class="activity-completion-video countries-completion-video" src="../assets/video/shared/wohoo-you-did-it.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="countries-popup-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <div class="countries-toolbar">
        <p id="countries-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
      </div>

      <button id="countries-word" class="countries-word" type="button" aria-label="Hear the word countries">
        <span class="countries-word-letter" aria-hidden="true">c</span><span class="countries-word-letter" aria-hidden="true">o</span><span class="countries-word-letter" aria-hidden="true">u</span><span class="countries-word-letter" aria-hidden="true">n</span><span class="countries-word-letter" aria-hidden="true">t</span><span class="countries-word-letter" aria-hidden="true">r</span><span class="countries-word-letter" aria-hidden="true">i</span><span class="countries-word-letter" aria-hidden="true">e</span><span class="countries-word-letter" aria-hidden="true">s</span>
      </button>
      <button id="countries-try-again" class="pill-btn blue countries-try-again" type="button" hidden>↻ Try Again</button>
    </section>

    <audio id="countries-intro-audio" src="../assets/audio/week-4/literacy/page-05/intro.mp3" preload="auto"></audio>
    <audio id="countries-letter-audio" preload="auto"></audio>
    <audio id="countries-word-audio" src="../assets/audio/week-4/literacy/page-05/countries.mp3" preload="auto"></audio>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-4-page-05.js"></script>
</body>
</html>
