<body><main class="page">

  <section id="lesson-focus" class="card practice-activity-card" aria-label="Where are we activity">
    <div class="practice-stage">
      <img class="practice-picture" src="../assets/images/week-2/literacy/page-03-soccer-practice.jpg" width="1412" height="1114" alt="Children practicing soccer on a soccer field. Where are we?">
      <button id="practice-question-speaker" class="sentence-speaker question-speaker" type="button" aria-label="Listen to Where are we again" disabled>🔊</button>
      <div class="practice-choices" role="group" aria-label="Choose where the children are">
        <div class="practice-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-correct="true" data-sentence="We are at soccer practice." data-audio="../assets/audio/week-2/literacy/page-03-answer-soccer-practice.mp3"><span class="choice-mark" aria-hidden="true">✓</span><span>We are at soccer practice.</span><button class="sentence-speaker" type="button" aria-label="Listen to We are at soccer practice" disabled>🔊</button></div>
        <div class="practice-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-correct="false" data-sentence="We are at the store." data-audio="../assets/audio/week-2/literacy/page-03-answer-store.mp3"><span class="choice-mark" aria-hidden="true"></span><span>We are at the store.</span><button class="sentence-speaker" type="button" aria-label="Listen to We are at the store" disabled>🔊</button></div>

          <button id="practice-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>

          <div class="activity-completion-actions"><button id="practice-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
        </div>
      </div>
    </div>
    <p id="practice-status" class="practice-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
  </section>
  <audio id="practice-intro-audio" preload="auto" src="../assets/audio/week-2/literacy/page-03-intro.mp3"></audio>
  <audio id="practice-question-audio" preload="auto" src="../assets/audio/week-2/literacy/page-03-question.mp3"></audio>
