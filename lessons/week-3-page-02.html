<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Literacy Week 3 — Page 3 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/week-3-page-03.css?v=20260826-1">
</head>
<body class="week-3-event-body">
  <main class="page literacy-activity-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-3-page-01.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 3 of 6</span>
      <a class="back-link next-page-link" href="week-3-page-03.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-3.html#card-literacy">🏠 Week 3 Home</a>

    <header class="center" style="margin-top:16px">
      <h1 class="big-title week-3-event-title" style="font-size:2.4rem">Week 3 — Where are we?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=3">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=3">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card literacy-quiz week-3-event-quiz" aria-label="What event is it activity">
      <div class="week-3-event-stage">
        <img class="week-3-event-background" src="../assets/images/week-3/literacy/page-03-background.webp" width="1412" height="1114" alt="What event is it? Circle the right answer.">
        <video id="week-3-event-video" class="week-3-character-video" playsinline preload="auto" aria-label="Olympic medalists asking the question"></video>

        <button id="replay-week-3-question" class="week-3-question-speaker" type="button" aria-label="Play the introduction and question">🔊</button>

        <div class="week-3-answer-panel">
          <div class="answer-list" role="radiogroup" aria-label="Choose where the event is">
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="sports-game">
              <span class="choice-circle choice-blue" aria-hidden="true"><span></span></span>
              <span class="choice-text">At a sports game.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: At a sports game." data-speak="At a sports game." disabled>🔊</button>
            </div>
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="school">
              <span class="choice-circle choice-green" aria-hidden="true"><span></span></span>
              <span class="choice-text">At a school.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: At a school." data-speak="At a school." disabled>🔊</button>
            </div>
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="olympic-games">
              <span class="choice-circle choice-orange" aria-hidden="true"><span></span></span>
              <span class="choice-text">At the Olympic Games.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: At the Olympic Games." data-speak="At the Olympic Games." disabled>🔊</button>
            </div>
          </div>
          <p id="week-3-answer-feedback" class="answer-feedback" role="status" aria-live="polite">Listen, then choose one answer.</p>
        </div>

        <div id="week-3-event-start" class="week-3-start-layer">
          <button id="week-3-event-start-button" class="week-3-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="week-3-event-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame week-3-completion-frame">
            <button id="week-3-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="week-3-good-job-video" class="activity-completion-video" src="../assets/video/shared/wohoo-you-did-it.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="week-3-completion-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <button id="restart-week-3-event" class="pill-btn blue week-3-restart" type="button">↻ Try Again</button>
    </section>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-3-page-03.js"></script>
</body>
</html>
