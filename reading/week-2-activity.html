<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Why Do We Practice? Activity — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/reading-week-2-activity.css?v=20260831-1">
</head>
<body>
  <div class="floaties" aria-hidden="true"><span style="top:12%;left:4%">🪀</span><span style="top:72%;left:94%">⭐</span></div>
  <main class="page reading-activity-page">
    <a class="back-link" href="week-2.html">⬅️ Yo-Yo Goes Up and Down</a>
    <header class="reading-activity-header">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem"><img class="page-title-icon" src="../assets/images/ui/reading-3d.webp" alt="">Why Do We Practice?</h1>
      <div class="reading-intro-row">
        <p class="subtitle">Little Thinkers — Listen, think, and choose the best answer!</p>
        <button class="reading-speaker" id="reading-intro-speaker" type="button" aria-label="Listen to the activity instructions">🔊</button>
      </div>
    </header>
    <section class="reading-board" aria-labelledby="reading-question">
      <div class="reading-progress"><span id="reading-progress-label">Question 1 of 4</span><span class="reading-progress-dots" id="reading-progress-dots" aria-hidden="true"></span></div>
      <div class="reading-question-panel">
        <img class="reading-question-picture" id="reading-question-picture" src="../assets/images/week-2/reading/philosophy/q1-question.webp" alt="">
        <div class="reading-question-copy"><h2 class="reading-question-main" id="reading-question"></h2></div>
        <button class="reading-speaker" id="reading-question-speaker" type="button" aria-label="Listen to the question">🔊</button>
      </div>
      <div class="reading-answers" id="reading-answers"></div>
      <p class="reading-feedback" id="reading-feedback" aria-live="polite"></p>
    </section>
  </main>
  <div class="reading-completion" id="reading-completion" role="dialog" aria-modal="true" aria-labelledby="reading-completion-title" hidden>
    <div class="reading-completion-card">
      <img class="reading-completion-picture" src="../assets/images/week-2/reading/philosophy/q4-learn-grow.webp" alt="A child climbs colorful learning steps little by little.">
      <h2 id="reading-completion-title">Great job!</h2>
      <p>You finished the Little Thinkers activity!</p>
      <div class="reading-completion-actions">
        <button class="reading-speaker" id="reading-completion-speaker" type="button" aria-label="Listen to the congratulations message">🔊</button>
        <button class="pill-btn green" id="reading-try-again" type="button">🔄 Try Again</button>
        <a class="pill-btn blue" href="week-2.html">🎬 Back to Reading</a>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/reading-week-2-activity.js?v=20260831-2"></script>
</body>
</html>
