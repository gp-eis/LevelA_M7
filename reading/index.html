<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading 📚 — Athlete People</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: linear-gradient(180deg, #8ad4ff 0%, #d4f0ff 45%, #fff8e8 100%); }

    .bokeh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bokeh span {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%,
                  rgba(255, 255, 255, .9),
                  rgba(255, 255, 255, .35) 58%,
                  rgba(255, 255, 255, 0) 72%);
      animation: bokeh-drift 16s ease-in-out infinite;
    }
    .bokeh span:nth-child(1) { width: 260px; height: 260px; top: -70px;  left: -60px; }
    .bokeh span:nth-child(2) { width: 150px; height: 150px; top: 12%;    right: 8%;   animation-duration: 21s; }
    .bokeh span:nth-child(3) { width: 90px;  height: 90px;  top: 46%;    left: 6%;    animation-duration: 13s; }
    .bokeh span:nth-child(4) { width: 200px; height: 200px; bottom: -60px; right: 12%; animation-duration: 24s; }
    .bokeh span:nth-child(5) { width: 70px;  height: 70px;  bottom: 18%; left: 22%;   animation-duration: 18s; }
    .bokeh span:nth-child(6) { width: 120px; height: 120px; top: 60%;    right: 4%;   animation-duration: 15s; }

    @keyframes bokeh-drift {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-26px) scale(1.06); }
    }

    .hub-header { margin-top: 18px; }

    .hub-title {
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: #1e6fd9;
      -webkit-text-stroke: 10px #ffffff;
      paint-order: stroke fill;
      text-shadow: 0 7px 0 rgba(30, 111, 217, .22), 0 14px 22px rgba(30, 111, 217, .22);
    }

    .hub-title .emoji {
      -webkit-text-stroke: 0;
      margin-right: 10px;
      filter: drop-shadow(0 6px 8px rgba(74, 59, 82, .25));
    }

    .hub-subtitle {
      margin-top: 10px;
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
      font-weight: 800;
      color: #0f8a62;
      -webkit-text-stroke: 6px #ffffff;
      paint-order: stroke fill;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 26px;
      margin-top: 36px;
    }

    .week-card {
      display: block;
      padding: 10px;
      border-radius: 46px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, var(--frame-light), var(--frame));
      box-shadow:
        0 10px 0 var(--frame-dark),
        0 16px 24px rgba(30, 58, 95, .18);
      filter: none;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .week-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      filter: brightness(1.03);
      box-shadow:
        0 16px 0 var(--frame-dark),
        0 22px 28px rgba(30, 58, 95, .22);
    }
    .week-card:active {
      transform: translateY(3px);
      box-shadow:
        0 4px 0 var(--frame-dark),
        0 8px 14px rgba(30, 58, 95, .16);
    }

    .week-card:focus-visible {
      outline: 6px solid #ffffff;
      outline-offset: 5px;
    }

    .week-card__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 250px;
      padding: 26px 16px 24px;
      border-radius: 36px;
      background: linear-gradient(180deg, #ffffff, #f4fbff);
    }

    .week-card__icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      border-radius: 30px;
      font-size: 3.5rem;
      line-height: 1;
      background: linear-gradient(160deg, var(--frame-light), var(--frame));
      box-shadow:
        inset 0 5px 12px rgba(255, 255, 255, .8),
        inset 0 -9px 16px rgba(0, 0, 0, .12),
        0 8px 14px rgba(30, 58, 95, .18);
    }

    .week-card__icon::after {
      content: '';
      position: absolute;
      inset: 7px 7px 52% 7px;
      border-radius: 23px 23px 40px 40px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .week-card__label {
      display: block;
      font-size: 1.55rem;
      font-weight: 800;
      color: #1e3a5f;
    }

    .week-card__hint {
      display: block;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.28;
      color: #3d5a78;
      text-align: center;
      max-width: 18ch;
    }

    .week-card.pink   { --frame: #ff6b6b; --frame-light: #ff9a9a; --frame-dark: #d64545; }
    .week-card.blue   { --frame: #3db5ff; --frame-light: #8ad4ff; --frame-dark: #1e6fd9; }
    .week-card.green  { --frame: #7ed957; --frame-light: #aeec8d; --frame-dark: #4ea62c; }
    .week-card.orange { --frame: #ff9f1c; --frame-light: #ffc978; --frame-dark: #d97d00; }

    .week-card.is-locked {
      opacity: .55;
      filter: grayscale(.35);
      cursor: not-allowed;
      box-shadow:
        0 6px 0 #9aa8b8,
        0 10px 16px rgba(30, 58, 95, .12);
    }
    .week-card.is-locked:hover,
    .week-card.is-locked:active {
      transform: none;
      filter: grayscale(.35);
      box-shadow:
        0 6px 0 #9aa8b8,
        0 10px 16px rgba(30, 58, 95, .12);
    }
    .week-card.is-locked .week-card__hint {
      color: #7a8fa6;
      font-weight: 700;
    }

    .back-link {
      font-size: 1.15rem;
      padding: 12px 28px;
      box-shadow: 0 6px 0 rgba(42, 159, 214, .3), 0 12px 20px rgba(42, 159, 214, .18);
    }
  </style>
</head>
<body>

  <div class="bokeh" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="floaties" aria-hidden="true">
    <span style="top:14%; left:92%;">📚</span>
    <span style="top:24%; left:96%;">📖</span>
    <span style="top:78%; left:4%;">⭐</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month 7 Level A.html">⬅️ Home</a>

    <header class="hub-header center">
      <h1 class="hub-title"><img class="hub-title-icon" src="../assets/images/ui/reading-3d.png" alt="">Reading</h1>
      <p class="hub-subtitle">Pick a week to watch reading videos!</p>
    </header>

    <div class="week-grid">
      <a class="week-card pink" href="week-1.html" data-week="1" aria-label="Week 1 — What sport do you play?">
        <span class="week-card__inner">
          <span class="week-card__icon" aria-hidden="true"><img class="week-card__icon-img" src="../assets/images/week-1/memory/soccer.png" alt=""></span>
          <span class="week-card__label">Week 1</span>
          <span class="week-card__hint">What sport do you play?</span>
        </span>
      </a>
      <a class="week-card blue" href="week-2.html" data-week="2" aria-label="Week 2 — Coming soon">
        <span class="week-card__inner">
          <span class="week-card__icon" aria-hidden="true"><img class="week-card__icon-img" src="../assets/images/ui/gp-weightlifting-3d.png" alt=""></span>
          <span class="week-card__label">Week 2</span>
          <span class="week-card__hint">What do you practice?</span>
        </span>
      </a>
      <a class="week-card green" href="week-3.html" data-week="3" aria-label="Week 3 — Coming soon">
        <span class="week-card__inner">
          <span class="week-card__icon" aria-hidden="true"><img class="week-card__icon-img" src="../assets/images/ui/sport-medal-3d.png" alt=""></span>
          <span class="week-card__label">Week 3</span>
          <span class="week-card__hint">What event is it?</span>
        </span>
      </a>
      <a class="week-card orange" href="week-4.html" data-week="4" aria-label="Week 4 — Coming soon">
        <span class="week-card__inner">
          <span class="week-card__icon" aria-hidden="true"><img class="week-card__icon-img" src="../assets/images/ui/world-globe-3d.png" alt=""></span>
          <span class="week-card__label">Week 4</span>
          <span class="week-card__hint">Where do Olympic athletes come from?</span>
        </span>
      </a>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
