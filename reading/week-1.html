<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Week 1 — What sport do you play? — Athlete People</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .reading-note {
      margin-top: 14px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #3d5a78;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">📚</span>
    <span style="top:70%; left:94%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="index.html">⬅️ Reading</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">📚 Week 1 — What sport do you play?</h1>
    </header>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">🎬 Reading Video</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="metadata"
        src="../assets/video/week-1/Reading/Area-Poem-Week1.mp4"
        aria-label="Reading video for Week 1"
      ></video>
      <p class="reading-note">Tap the button below to play the reading video.</p>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Watch!</h2>
      <div class="dialogue-grid">
        <button
          class="pill-btn"
          type="button"
          data-dialogue
          data-video="../assets/video/week-1/Reading/Area-Poem-Week1.mp4"
          data-line="Area Poem"
        >
          <span aria-hidden="true">🎬</span> Area Poem
        </button>
      </div>
    </section>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
