<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Race Day — Reading Week 1 — Athlete People</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .reading-note {
      margin-top: 14px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #3d5a78;
      text-align: center;
    }

    /* Preserve the complete story frame instead of cropping it to the
       shared lesson-video aspect ratio. */
    .reading-story-video {
      aspect-ratio: auto;
      height: auto;
      max-height: 72svh;
      object-fit: contain;
      background: #000;
    }

    .reading-story-video:fullscreen,
    .reading-story-video:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      border-radius: 0;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">📚</span>
    <span style="top:70%; left:94%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month%207%20Level%20A.html">⬅️ Week 1 Home</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/reading-3d.webp" alt="">Bike Race Day</h1>
    </header>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">🎬 Reading Video</h2>
      <video
        id="dialogue-video"
        class="lesson-video reading-story-video"
        controls
        preload="metadata"
        src="../assets/video/week-1/Reading/Bike-Race-Day.mp4"
        aria-label="Bike Race Day reading video"
      ></video>
      <p class="reading-note">Watch the story, then try the medal activity!</p>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Watch and Play!</h2>
      <div class="dialogue-grid">
        <button
          class="pill-btn"
          type="button"
          data-dialogue
          data-video="../assets/video/week-1/Reading/Bike-Race-Day.mp4"
          data-line="Bike Race Day"
        >
          <span aria-hidden="true">🎬</span> Bike Race Day
        </button>
        <a class="pill-btn green" href="week-1-activity.html">
          <span aria-hidden="true">🏅</span> Activity
        </a>
      </div>
    </section>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
