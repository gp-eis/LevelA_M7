<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Race Day — Reading Week 1 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .reading-note {
      margin-top: 14px;
      font-family: var(--font-friendly);
      font-weight: 600;
      font-size: 1.05rem;
      color: #3d5a78;
      text-align: center;
    }

    /* Preserve the complete story frame instead of cropping it to the
       shared lesson-video aspect ratio. */
    .reading-story-video {
      aspect-ratio: auto;
      height: auto;
      max-height: 72svh;
      object-fit: contain;
      background: #000;
    }

    .reading-story-video:fullscreen,
    .reading-story-video:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      border-radius: 0;
      object-fit: contain;
      background: #000;
    }
    .reading-activity-only { display:flex; justify-content:center; }
    .reading-activity-only .pill-btn { width:min(420px,90%); justify-content:center; }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">📚</span>
    <span style="top:70%; left:94%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="../week-1.html#card-reading">⬅️ Week 1 Home</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/reading-3d.webp" alt="">Bike Race Day</h1>
    </header>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">🎬 Reading Video</h2>
      <div class="video-play-shell">
        <video
          id="dialogue-video"
          class="lesson-video reading-story-video"
          controls
          playsinline
          preload="metadata"
          src="../assets/video/week-1/Reading/Bike-Race-Day.mp4"
          aria-label="Bike Race Day reading video"
        ></video>
        <button class="center-video-play" type="button" aria-label="Play Bike Race Day">▶</button>
      </div>
      <p class="reading-note">Watch the story, then try the medal activity!</p>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Watch and Play!</h2>
      <div class="reading-activity-only">
        <a class="pill-btn green" href="week-1-activity.html">
          <span aria-hidden="true">🏅</span> Activity
        </a>
      </div>
    </section>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
