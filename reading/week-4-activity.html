<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Are Friends! Activity — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .activity-page { width:min(1120px,95vw); padding-bottom:46px; }
    .activity-header { margin-top:12px; text-align:center; }
    .activity-intro-row { display:flex; align-items:center; justify-content:center; gap:10px; }
    .activity-intro-row .subtitle { margin:4px 0; }
    .activity-board { margin-top:20px; padding:clamp(16px,3vw,30px); border:7px solid #fff; border-radius:34px; background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.9) 0 5px,transparent 6px),linear-gradient(155deg,#fff8d8,#eaf9ff 52%,#f6eaff); box-shadow:0 11px 0 rgba(66,158,210,.2),0 20px 38px rgba(74,59,82,.13); }
    .activity-progress { display:flex; justify-content:center; align-items:center; gap:11px; margin-bottom:14px; color:#365979; font-family:var(--font-friendly); font-weight:800; }
    .progress-dots { display:flex; gap:8px; }
    .progress-dot { width:17px; height:17px; border:3px solid #79bfe9; border-radius:50%; background:#fff; }
    .progress-dot.done { border-color:var(--green-d); background:var(--green); }
    .progress-dot.current { border-color:var(--orange-d); background:var(--yellow); transform:scale(1.18); }
    .question-panel { display:grid; grid-template-columns:minmax(250px,1.1fr) minmax(240px,.9fr) auto; align-items:center; gap:18px; padding:14px; border:5px solid #78c8f5; border-radius:28px; background:rgba(255,255,255,.95); box-shadow:0 7px 0 rgba(57,149,203,.17); }
    .question-image { display:block; width:100%; aspect-ratio:3.1/1; border-radius:20px; object-fit:cover; box-shadow:0 5px 0 rgba(57,149,203,.15); }
    .question-main { margin:0; color:var(--text); font-size:clamp(1.35rem,3vw,1.9rem); line-height:1.18; text-align:center; }
    .speaker-btn { display:grid; place-items:center; width:52px; height:52px; border:0; border-radius:50%; color:#fff; background:linear-gradient(180deg,#55c9ff,#198fd7); box-shadow:0 6px 0 #106caa; font-size:1.35rem; cursor:pointer; }
    .speaker-btn:hover { transform:translateY(-2px) scale(1.04); }
    .speaker-btn:active { transform:translateY(3px); }
    .speaker-btn:focus-visible,.answer-select:focus-visible { outline:5px solid var(--yellow); outline-offset:3px; }
    .answers-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,2.4vw,26px); width:min(900px,100%); margin:22px auto 0; }
    .answer-card { position:relative; min-width:0; overflow:hidden; border:5px solid #fff; border-radius:28px; background:linear-gradient(180deg,#fff,#f3fbff); box-shadow:0 8px 0 rgba(61,132,180,.18),0 14px 24px rgba(74,59,82,.08); transition:border-color .16s ease,background .16s ease; }
    .answer-select { display:flex; width:100%; min-height:255px; flex-direction:column; align-items:center; gap:10px; padding:12px 12px 18px; border:0; background:transparent; color:var(--text); font:inherit; cursor:pointer; }
    .answer-select:hover:not(:disabled) { transform:translateY(-3px); }
    .answer-image { display:block; width:100%; aspect-ratio:1.5/1; border-radius:20px; object-fit:cover; }
    .answer-label { font-family:var(--font-friendly); font-size:clamp(1.1rem,2.3vw,1.4rem); font-weight:800; line-height:1.18; text-align:center; }
    .answer-listen { position:absolute; top:15px; right:15px; z-index:2; width:42px; height:42px; font-size:1rem; box-shadow:0 4px 0 #106caa; }
    .answer-card.is-correct { border-color:var(--green-d); background:#eaffdf; animation:correct-pop .55s ease; }
    .answer-card.is-wrong { border-color:#e04b55; background:#ffe9eb; animation:wrong-shake .5s ease; }
    .feedback-line { min-height:34px; margin:17px 0 0; color:#35627f; font-family:var(--font-friendly); font-size:1.2rem; font-weight:800; text-align:center; }
    .feedback-line.good { color:var(--green-d); }
    .feedback-line.try { color:#d23b47; }
    .completion-overlay { position:fixed; inset:0; z-index:180; display:grid; place-items:center; padding:20px; background:rgba(48,52,86,.48); backdrop-filter:blur(5px); }
    .completion-overlay[hidden] { display:none; }
    .completion-card { width:min(590px,94vw); padding:30px 26px 26px; border:8px solid var(--yellow); border-radius:36px; background:linear-gradient(180deg,#fff,#f5fff0); box-shadow:0 12px 0 rgba(217,151,0,.28),0 28px 60px rgba(44,36,67,.28); text-align:center; animation:completion-pop .55s cubic-bezier(.34,1.56,.64,1); }
    .completion-card h2 { margin:8px 0 5px; color:var(--green-d); font-size:clamp(2rem,7vw,2.8rem); }
    .completion-card p { margin:0 0 20px; color:var(--text); font-family:var(--font-friendly); font-size:1.25rem; font-weight:800; }
    .completion-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; }
    @keyframes wrong-shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-9px)} 50%{transform:translateX(9px)} }
    @keyframes correct-pop { 50%{transform:scale(1.035)} }
    @keyframes completion-pop { from{opacity:0;transform:scale(.55) rotate(-4deg)} to{opacity:1;transform:scale(1) rotate(0)} }
    @media (max-width:760px) {
      .activity-page { width:min(100%,620px); }
      .question-panel { grid-template-columns:1fr auto; }
      .question-image { grid-column:1/-1; }
      .answers-grid { grid-template-columns:1fr; }
      .answer-select { min-height:0; }
      .answer-image { aspect-ratio:1.5/1; }
    }
    @media (prefers-reduced-motion:reduce) { .answer-card,.completion-card { animation-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="floaties" aria-hidden="true"><span style="top:12%;left:4%">🌎</span><span style="top:72%;left:94%">💛</span></div>
  <main class="page activity-page">
    <a class="back-link" href="week-4.html">⬅️ We Are Friends!</a>
    <header class="activity-header">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem"><img class="page-title-icon" src="../assets/images/ui/reading-3d.webp" alt="">Friendship Challenge</h1>
      <div class="activity-intro-row"><p class="subtitle">Look, listen, and choose the right answer!</p><button class="speaker-btn" id="intro-speaker" type="button" aria-label="Listen to the instructions">🔊</button></div>
    </header>
    <section class="activity-board" aria-labelledby="question-main">
      <div class="activity-progress"><span id="progress-label">Question 1 of 4</span><span class="progress-dots" id="progress-dots" aria-hidden="true"></span></div>
      <div class="question-panel"><img class="question-image" id="question-image" alt=""><h2 class="question-main" id="question-main"></h2><button class="speaker-btn" id="question-speaker" type="button" aria-label="Listen to the question">🔊</button></div>
      <div class="answers-grid" id="answers-grid"></div>
      <p class="feedback-line" id="feedback-line" aria-live="polite"></p>
    </section>
  </main>
  <div class="completion-overlay" id="completion-overlay" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
    <div class="completion-card">
      <div style="font-size:4.2rem;line-height:1" aria-hidden="true">🌟</div>
      <h2 id="completion-title">Great job!</h2>
      <p>You finished the We Are Friends activity!</p>
      <div class="completion-actions"><button class="speaker-btn" id="completion-speaker" type="button" aria-label="Listen to the congratulations message">🔊</button><button class="pill-btn green" id="try-again" type="button">🔄 Try Again</button><a class="pill-btn blue" href="week-4.html">🎬 Back to Reading</a></div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/reading-week-4-activity.js?v=20260831-2"></script>
</body>
</html>
