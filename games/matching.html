<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Match 🧩 — Athlete People</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .game-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 18px;
    }
    .score {
      color: var(--purple-d);
      font-size: 1.2rem;
      font-weight: 800;
    }
    .match-board {
      max-width: 820px;
      margin: 22px auto 0;
      padding: 28px 24px 32px;
      border-radius: 30px;
      border: 5px solid rgba(255,255,255,.9);
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(228,248,255,.94));
      box-shadow: inset 0 -12px 20px rgba(30,111,217,.06), 0 12px 0 #b9e5f2, 0 22px 34px rgba(30,58,95,.16);
    }
    .choices-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      padding: 12px 10px 14px;
      border: 5px solid transparent;
      border-radius: 24px;
      background: radial-gradient(circle at 35% 18%, #fff, #effaff 78%);
      box-shadow: inset 0 -9px 14px rgba(30,111,217,.07), 0 8px 0 #c4e6f2, 0 14px 20px rgba(30,58,95,.14);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--yellow);
      transform: translateY(-7px) rotate(-1deg) scale(1.02);
      box-shadow: inset 0 -9px 14px rgba(30,111,217,.07), 0 13px 0 #e1b600, 0 20px 24px rgba(30,58,95,.18);
    }
    .choice-btn:focus-visible {
      outline: 5px solid var(--yellow);
      outline-offset: 2px;
    }
    .choice-btn:disabled { cursor: default; }
    .choice-btn img {
      display: block;
      width: 100%;
      height: min(170px, 28vw);
      object-fit: contain;
      border-radius: 16px;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 10px 6px rgba(30,58,95,.2));
    }
    .choice-emoji {
      display: none;
      font-size: clamp(3.2rem, 10vw, 4.8rem);
      line-height: 1;
      filter: drop-shadow(0 6px 4px rgba(30,58,95,.14));
    }
    .choice-btn.show-emoji .choice-emoji { display: block; }
    .choice-btn.show-emoji img { display: none; }
    .choice-btn.correct {
      border-color: var(--green);
      background: #eaffdf;
    }
    .choice-btn.wrong {
      border-color: #e04b55;
      background: #ffe9eb;
      animation: wrong-shake .55s ease;
    }
    .sentence-box {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-top: 26px;
      padding: 22px 20px;
      border: 6px solid var(--blue);
      border-radius: 26px;
      background: linear-gradient(180deg, #eef9ff, #fff);
    }
    .sentence-text {
      flex: 1;
      color: var(--text);
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
    }
    .listen-btn {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--blue), var(--blue-d));
      box-shadow: 0 5px 0 #1b7fae;
      color: var(--white);
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform .12s ease;
    }
    .listen-btn:hover { transform: scale(1.08); }
    .listen-btn:active { transform: translateY(2px); }
    .listen-btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .listen-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 160;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(65,45,86,.45);
      backdrop-filter: blur(3px);
    }
    .success-modal[hidden] { display: none; }
    .success-card {
      width: min(520px, 94vw);
      padding: 28px 26px 24px;
      border: 7px solid var(--green);
      border-radius: 32px;
      background: var(--white);
      box-shadow: 0 12px 0 rgba(61,140,30,.25), 0 24px 50px rgba(74,59,82,.28);
      text-align: center;
      animation: pop-in .5s cubic-bezier(.34,1.56,.64,1);
    }
    .success-title {
      margin-bottom: 16px;
      color: var(--green-d);
      font-size: clamp(2rem, 7vw, 2.8rem);
    }
    .success-review {
      display: grid;
      gap: 14px;
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 20px;
      background: #f6f0ff;
    }
    .success-review img,
    .success-review .review-emoji {
      display: block;
      width: min(220px, 70%);
      height: 180px;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 16px;
    }
    .success-review .review-emoji {
      display: none;
      place-items: center;
      font-size: 5rem;
      line-height: 1;
    }
    .success-review.show-emoji img { display: none; }
    .success-review.show-emoji .review-emoji { display: grid; }
    .success-review p {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      line-height: 1.35;
      color: var(--text);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.5) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
    }
    @media (max-width: 640px) {
      .choices-row { grid-template-columns: 1fr; }
      .choice-btn img { height: 150px; }
      .match-board { padding: 18px 12px 24px; }
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:10%; left:4%;">🧩</span>
    <span style="top:75%; left:93%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="index.html?week=1">⬅️ All Games</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/game-matching.webp" alt="">Picture Match</h1>
      <p class="subtitle">Read the sentence, then pick the picture that matches!</p>
    </header>

    <div class="game-toolbar">
      <button class="pill-btn orange" id="new-round" type="button">🔄 New Round</button>
      <span class="score">Correct: <span id="score">0</span></span>
    </div>

    <section class="match-board">
      <div class="choices-row" id="choices-row"></div>

      <div class="sentence-box">
        <p class="sentence-text" id="sentence-text"></p>
        <button class="listen-btn" id="sentence-listen" type="button" aria-label="Listen to the sentence">🔊</button>
      </div>
    </section>
  </div>

  <div class="success-modal" id="success-modal" role="dialog" aria-modal="true"
       aria-labelledby="success-title" hidden>
    <div class="success-card">
      <h2 class="success-title" id="success-title">Correct! 🎉</h2>
      <div class="success-review" id="success-review">
        <img id="review-image" src="" alt="">
        <span class="review-emoji" id="review-emoji" aria-hidden="true"></span>
        <p id="review-sentence"></p>
      </div>
      <button class="pill-btn green" id="continue-btn" type="button">✓ Continue</button>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const IMAGE_BASE = '../assets/images/week-1/memory';

    const PICTURES = [
      { id: 'golf',     label: 'golf',     emoji: '⛳', image: `${IMAGE_BASE}/golf.webp` },
      { id: 'soccer',   label: 'soccer',   emoji: '⚽', image: `${IMAGE_BASE}/soccer.webp` },
      { id: 'baseball', label: 'baseball', emoji: '⚾', image: `${IMAGE_BASE}/baseball.webp` },
      { id: 'tennis',   label: 'tennis',   emoji: '🎾', image: `${IMAGE_BASE}/tennis.webp` },
      { id: 'milk',     label: 'milk',     emoji: '🥛', image: `${IMAGE_BASE}/milk.webp` },
      { id: 'meat',     label: 'meat',     emoji: '🥩', image: `${IMAGE_BASE}/meat.webp` },
      { id: 'mango',    label: 'mango',    emoji: '🥭', image: `${IMAGE_BASE}/mango.webp` },
      { id: 'athlete',  label: 'athlete',  emoji: '🏃', image: `${IMAGE_BASE}/athlete.webp` }
    ];

    const SENTENCES = [
      { text: 'The mango is here.', pictureId: 'mango' },
      { text: 'The meat is here.',  pictureId: 'meat' },
      { text: 'The milk is here.',  pictureId: 'milk' },
      { text: 'I play soccer.',     pictureId: 'soccer' },
      { text: 'I play baseball.',   pictureId: 'baseball' },
      { text: 'I play tennis.',     pictureId: 'tennis' },
      { text: 'I play golf.',       pictureId: 'golf' },
      { text: 'I am an athlete.',   pictureId: 'athlete' }
    ];

    const choicesRow = document.getElementById('choices-row');
    const sentenceText = document.getElementById('sentence-text');
    const sentenceListen = document.getElementById('sentence-listen');
    const successModal = document.getElementById('success-modal');
    const successReview = document.getElementById('success-review');
    const reviewImage = document.getElementById('review-image');
    const reviewEmoji = document.getElementById('review-emoji');
    const reviewSentence = document.getElementById('review-sentence');
    const continueBtn = document.getElementById('continue-btn');
    const scoreEl = document.getElementById('score');

    const pictureById = Object.fromEntries(PICTURES.map(picture => [picture.id, picture]));

    let locked = false;
    let score = 0;
    let currentRound = null;
    let lastRoundKey = '';
    let usVoice = null;

    const sounds = (() => {
      let ctx = null;
      function audio() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(frequency, start, duration, type = 'sine', volume = .14) {
        const osc = audio().createOscillator();
        const gain = audio().createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain);
        gain.connect(audio().destination);
        osc.start(start);
        osc.stop(start + duration + .02);
      }
      return {
        correct() {
          const now = audio().currentTime;
          tone(523, now, .12, 'sine', .15);
          tone(659, now + .08, .12, 'sine', .15);
          tone(784, now + .16, .2, 'sine', .17);
        },
        wrong() {
          const now = audio().currentTime;
          tone(220, now, .14, 'sawtooth', .07);
          tone(175, now + .1, .18, 'sawtooth', .065);
        }
      };
    })();

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      usVoice = voices.find(v => /^en[-_]US$/i.test(v.lang || '') && /google|samantha|zira|jenny|aria|english/i.test(v.name))
        || voices.find(v => /^en[-_]US$/i.test(v.lang || ''))
        || null;
    }

    if ('speechSynthesis' in window) {
      pickVoice();
      speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }

    function speak(text) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = .92;
        if (usVoice) utterance.voice = usVoice;
        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();
        speechSynthesis.speak(utterance);
      });
    }

    function buildRound() {
      let sentence;
      let key;
      do {
        sentence = SENTENCES[Math.floor(Math.random() * SENTENCES.length)];
        const correctPicture = pictureById[sentence.pictureId];
        const wrongPool = PICTURES.filter(picture => picture.id !== sentence.pictureId);
        const choices = shuffle([
          correctPicture,
          ...shuffle(wrongPool).slice(0, 2)
        ]);
        key = `${sentence.text}|${choices.map(choice => choice.id).sort().join(',')}`;
        if (key !== lastRoundKey) {
          lastRoundKey = key;
          return { sentence: sentence.text, correctId: sentence.pictureId, choices };
        }
      } while (true);
    }

    function bindPicture(img, emojiEl, faceEl, picture) {
      faceEl.classList.remove('show-emoji');
      emojiEl.textContent = picture.emoji;
      img.alt = picture.label;
      img.onerror = () => {
        faceEl.classList.add('show-emoji');
      };
      img.src = picture.image;
    }

    function renderRound(autoSpeak = true) {
      locked = false;
      successModal.hidden = true;
      currentRound = buildRound();
      sentenceText.textContent = currentRound.sentence;
      choicesRow.innerHTML = '';

      sentenceListen.onclick = () => {
        if (locked) return;
        speak(currentRound.sentence);
      };

      currentRound.choices.forEach(picture => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.dataset.pictureId = picture.id;
        btn.setAttribute('aria-label', `Choose picture: ${picture.label}`);

        const image = document.createElement('img');
        image.draggable = false;

        const emoji = document.createElement('span');
        emoji.className = 'choice-emoji';
        emoji.setAttribute('aria-hidden', 'true');

        bindPicture(image, emoji, btn, picture);

        btn.appendChild(image);
        btn.appendChild(emoji);
        btn.addEventListener('click', () => choosePicture(btn, picture.id));
        choicesRow.appendChild(btn);
      });

      if (autoSpeak) speak(currentRound.sentence);
    }

    async function choosePicture(button, pictureId) {
      if (locked) return;
      locked = true;
      choicesRow.querySelectorAll('.choice-btn').forEach(btn => btn.disabled = true);

      if (pictureId === currentRound.correctId) {
        sounds.correct();
        button.classList.add('correct');
        const correctPicture = pictureById[currentRound.correctId];
        successReview.classList.remove('show-emoji');
        reviewEmoji.textContent = correctPicture.emoji;
        reviewImage.alt = correctPicture.label;
        reviewImage.onerror = () => successReview.classList.add('show-emoji');
        reviewImage.src = correctPicture.image;
        reviewSentence.textContent = currentRound.sentence;
        successModal.hidden = false;
        continueBtn.focus();
        sentenceListen.disabled = true;
        score++;
        scoreEl.textContent = score;
        await speak(currentRound.sentence);
      } else {
        sounds.wrong();
        button.classList.add('wrong');
        setTimeout(() => {
          button.classList.remove('wrong');
          choicesRow.querySelectorAll('.choice-btn').forEach(btn => btn.disabled = false);
          locked = false;
        }, 650);
      }
    }

    continueBtn.addEventListener('click', () => {
      sentenceListen.disabled = false;
      renderRound();
    });
    document.getElementById('new-round').addEventListener('click', () => renderRound());
    renderRound();
  </script>
</body>
</html>
