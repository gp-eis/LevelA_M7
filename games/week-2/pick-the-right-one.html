<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick the Right One ✅ — Athlete People</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .game-toolbar {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }
    .pick-board {
      max-width: 720px;
      margin: 22px auto 0;
      padding: 28px 24px 32px;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 10px 0 rgba(179,136,255,.18), 0 16px 30px rgba(74,59,82,.1);
    }
    .question-box {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 22px 20px;
      border: 6px solid var(--purple);
      border-radius: 26px;
      background: linear-gradient(180deg, #faf5ff, #fff);
    }
    .question-text {
      flex: 1;
      color: var(--text);
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
    }
    .listen-btn {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--blue), var(--blue-d));
      box-shadow: 0 5px 0 #1b7fae;
      color: var(--white);
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform .12s ease;
    }
    .listen-btn:hover { transform: scale(1.08); }
    .listen-btn:active { transform: translateY(2px); }
    .listen-btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .listen-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .answers-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 24px;
    }
    .answer-btn {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 18px 14px;
      border: 5px solid transparent;
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 7px 0 rgba(74,59,82,.12);
      cursor: pointer;
      text-align: center;
      transition: transform .15s ease, border-color .15s ease;
    }
    .answer-btn:hover:not(:disabled) { border-color: var(--yellow); transform: translateY(-4px); }
    .answer-btn:focus-visible { outline: 5px solid var(--yellow); outline-offset: 2px; }
    .answer-btn:disabled { cursor: default; }
    .answer-btn .answer-text {
      flex: 1;
      color: var(--text);
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      font-weight: 600;
      line-height: 1.3;
    }
    .answer-btn .listen-btn { margin: 0 auto; }
    .answer-btn.wrong {
      border-color: #e04b55;
      background: #ffe9eb;
      animation: wrong-shake .55s ease;
    }
    .answer-btn.correct {
      border-color: var(--green);
      background: #eaffdf;
    }
    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 160;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(65,45,86,.45);
      backdrop-filter: blur(3px);
    }
    .success-modal[hidden] { display: none; }
    .success-card {
      width: min(520px, 94vw);
      padding: 28px 26px 24px;
      border: 7px solid var(--green);
      border-radius: 32px;
      background: var(--white);
      box-shadow: 0 12px 0 rgba(61,140,30,.25), 0 24px 50px rgba(74,59,82,.28);
      text-align: center;
      animation: pop-in .5s cubic-bezier(.34,1.56,.64,1);
    }
    .success-title {
      margin-bottom: 16px;
      color: var(--green-d);
      font-size: clamp(2rem, 7vw, 2.8rem);
    }
    .success-review {
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 20px;
      background: #f6f0ff;
      text-align: left;
    }
    .success-review p {
      margin: 0 0 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      line-height: 1.35;
      color: var(--text);
    }
    .success-review p:last-child { margin-bottom: 0; }
    .success-review strong { color: var(--purple-d); }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.5) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
    }
    @media (max-width: 560px) {
      .answers-row { grid-template-columns: 1fr; }
      .pick-board { padding: 18px 12px 24px; }
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:10%; left:4%;">✅</span>
    <span style="top:75%; left:93%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="../index.html?week=2">⬅️ All Games</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">✅ Pick the Right One</h1>
      <p class="subtitle">Listen to the question, then pick the best answer!</p>
    </header>

    <div class="game-toolbar">
      <button class="pill-btn orange" id="new-question" type="button">🔄 New Question</button>
    </div>

    <section class="pick-board">
      <div class="question-box">
        <p class="question-text" id="question-text"></p>
        <button class="listen-btn" id="question-listen" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <div class="answers-row" id="answers-row"></div>
    </section>
  </div>

  <div class="success-modal" id="success-modal" role="dialog" aria-modal="true"
       aria-labelledby="success-title" hidden>
    <div class="success-card">
      <h2 class="success-title" id="success-title">Correct! 🎉</h2>
      <div class="success-review">
        <p><strong>Question:</strong> <span id="review-question"></span></p>
        <p><strong>Answer:</strong> <span id="review-answer"></span></p>
      </div>
      <button class="pill-btn green" id="continue-btn" type="button">✓ Continue</button>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script>
    const RAIN_ANSWERS = [
      "It's raining very lightly.",
      "It's raining lightly.",
      "It's raining heavily.",
      "It's raining very heavily.",
      "It's raining cats and dogs."
    ];

    const QUESTION_BANK = [
      {
        question: 'Is it raining?',
        correct: 'Yes. It is.'
      },
      {
        question: 'How heavy is the rain?',
        correctOptions: RAIN_ANSWERS
      },
      {
        question: 'Share my umbrella.',
        correct: 'Really? Thank you!'
      },
      {
        question: 'Do you like the rain?',
        correct: 'Yes. I like the rain.'
      }
    ];

    const questionText = document.getElementById('question-text');
    const questionListen = document.getElementById('question-listen');
    const answersRow = document.getElementById('answers-row');
    const successModal = document.getElementById('success-modal');
    const reviewQuestion = document.getElementById('review-question');
    const reviewAnswer = document.getElementById('review-answer');
    const continueBtn = document.getElementById('continue-btn');

    let locked = false;
    let currentRound = null;
    let lastQuestionKey = '';
    let usVoice = null;

    const sounds = (() => {
      let ctx = null;
      function audio() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(frequency, start, duration, type = 'sine', volume = .14) {
        const osc = audio().createOscillator();
        const gain = audio().createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain);
        gain.connect(audio().destination);
        osc.start(start);
        osc.stop(start + duration + .02);
      }
      return {
        correct() {
          const now = audio().currentTime;
          tone(523, now, .12, 'sine', .15);
          tone(659, now + .08, .12, 'sine', .15);
          tone(784, now + .16, .2, 'sine', .17);
        },
        wrong() {
          const now = audio().currentTime;
          tone(220, now, .14, 'sawtooth', .07);
          tone(175, now + .1, .18, 'sawtooth', .065);
        }
      };
    })();

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      usVoice = voices.find(v => v.lang === 'en-US' && /google|samantha|zira|jenny|aria|english/i.test(v.name))
        || voices.find(v => v.lang.startsWith('en-US'))
        || voices.find(v => v.lang.startsWith('en'))
        || null;
    }

    if ('speechSynthesis' in window) {
      pickVoice();
      speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }

    function speak(text) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = .92;
        if (usVoice) utterance.voice = usVoice;
        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();
        speechSynthesis.speak(utterance);
      });
    }

    function speakSequence(parts) {
      return parts.reduce((chain, text) => chain.then(() => speak(text)), Promise.resolve());
    }

    function getCorrectAnswersForItem(item) {
      return item.correctOptions ? [...item.correctOptions] : [item.correct];
    }

    function getWrongOptionsForItem(item, correct) {
      return QUESTION_BANK
        .filter(other => other !== item)
        .flatMap(getCorrectAnswersForItem)
        .filter(answer => answer !== correct);
    }

    function buildRound() {
      let item;
      let key;
      do {
        item = QUESTION_BANK[Math.floor(Math.random() * QUESTION_BANK.length)];
        const correct = item.correctOptions
          ? item.correctOptions[Math.floor(Math.random() * item.correctOptions.length)]
          : item.correct;
        key = `${item.question}|${correct}`;
        if (key !== lastQuestionKey) {
          lastQuestionKey = key;
          const wrongOptions = getWrongOptionsForItem(item, correct);
          const wrong = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
          return { question: item.question, correct, wrong };
        }
      } while (true);
    }

    function makeListenButton(label, text) {
      const btn = document.createElement('button');
      btn.className = 'listen-btn';
      btn.type = 'button';
      btn.textContent = '🔊';
      btn.setAttribute('aria-label', label);
      btn.addEventListener('click', event => {
        event.stopPropagation();
        if (locked) return;
        speak(text);
      });
      return btn;
    }

    function renderRound() {
      locked = false;
      successModal.hidden = true;
      currentRound = buildRound();
      questionText.textContent = currentRound.question;
      answersRow.innerHTML = '';

      questionListen.onclick = () => {
        if (locked) return;
        speak(currentRound.question);
      };

      shuffle([currentRound.correct, currentRound.wrong]).forEach(answer => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer-btn';
        btn.dataset.answer = answer;

        const text = document.createElement('span');
        text.className = 'answer-text';
        text.textContent = answer;

        btn.appendChild(text);
        btn.appendChild(makeListenButton(`Listen to answer: ${answer}`, answer));

        btn.addEventListener('click', () => chooseAnswer(btn, answer));
        answersRow.appendChild(btn);
      });
    }

    async function chooseAnswer(button, answer) {
      if (locked) return;
      locked = true;
      answersRow.querySelectorAll('.answer-btn').forEach(btn => btn.disabled = true);

      if (answer === currentRound.correct) {
        sounds.correct();
        button.classList.add('correct');
        reviewQuestion.textContent = currentRound.question;
        reviewAnswer.textContent = currentRound.correct;
        successModal.hidden = false;
        continueBtn.focus();
        questionListen.disabled = true;
        await speakSequence([currentRound.question, currentRound.correct]);
      } else {
        sounds.wrong();
        button.classList.add('wrong');
        setTimeout(() => {
          button.classList.remove('wrong');
          answersRow.querySelectorAll('.answer-btn').forEach(btn => btn.disabled = false);
          locked = false;
        }, 650);
      }
    }

    continueBtn.addEventListener('click', () => {
      questionListen.disabled = false;
      renderRound();
    });
    document.getElementById('new-question').addEventListener('click', renderRound);
    renderRound();
  </script>
</body>
</html>
