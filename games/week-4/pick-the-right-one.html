<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 Pick the Right One ✅ — Athlete</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .game-toolbar {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }
    .pick-board {
      max-width: 720px;
      margin: 22px auto 0;
      padding: 28px 24px 32px;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 10px 0 rgba(179,136,255,.18), 0 16px 30px rgba(74,59,82,.1);
    }
    .question-box {
      display: grid;
      grid-template-columns: 170px 1fr 52px;
      align-items: center;
      gap: 14px;
      padding: 22px 20px;
      border: 6px solid var(--purple);
      border-radius: 26px;
      background: linear-gradient(180deg, #faf5ff, #fff);
    }
    .question-visual {
      width: 170px;
      height: 145px;
      border-radius: 18px;
      object-fit: contain;
      background: #eef8ff;
    }
    .question-text {
      flex: 1;
      color: var(--text);
      font-family: var(--font-friendly);
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
    }
    .listen-btn {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--blue), var(--blue-d));
      box-shadow: 0 5px 0 #1b7fae;
      color: var(--white);
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform .12s ease;
    }
    .listen-btn:hover { transform: scale(1.08); }
    .listen-btn:active { transform: translateY(2px); }
    .listen-btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .listen-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .answers-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 24px;
    }
    .answer-btn {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 18px 14px;
      border: 5px solid transparent;
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 7px 0 rgba(74,59,82,.12);
      cursor: pointer;
      text-align: center;
      transition: transform .15s ease, border-color .15s ease;
    }
    .answer-btn:hover:not(:disabled) { border-color: var(--yellow); transform: translateY(-4px); }
    .answer-btn:focus-visible { outline: 5px solid var(--yellow); outline-offset: 2px; }
    .answer-btn:disabled { cursor: default; }
    .answer-btn .answer-text {
      flex: 1;
      color: var(--text);
      font-family: var(--font-friendly);
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      font-weight: 600;
      line-height: 1.3;
    }
    .answer-visual {
      display: block;
      width: 100%;
      height: 180px;
      border-radius: 16px;
      object-fit: contain;
      background: #eef8ff;
    }
    .answer-btn .listen-btn { margin: 0 auto; }
    .answer-btn.wrong {
      border-color: #e04b55;
      background: #ffe9eb;
      animation: wrong-shake .55s ease;
    }
    .answer-btn.correct {
      border-color: var(--green);
      background: #eaffdf;
    }
    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 160;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(65,45,86,.45);
      backdrop-filter: blur(3px);
    }
    .success-modal[hidden] { display: none; }
    .success-card {
      width: min(520px, 94vw);
      padding: 28px 26px 24px;
      border: 7px solid var(--green);
      border-radius: 32px;
      background: var(--white);
      box-shadow: 0 12px 0 rgba(61,140,30,.25), 0 24px 50px rgba(74,59,82,.28);
      text-align: center;
      animation: pop-in .5s cubic-bezier(.34,1.56,.64,1);
    }
    .success-title {
      margin-bottom: 16px;
      color: var(--green-d);
      font-size: clamp(2rem, 7vw, 2.8rem);
    }
    .success-review {
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 20px;
      background: #f6f0ff;
      text-align: left;
    }
    .success-review p {
      margin: 0 0 10px;
      font-family: var(--font-friendly);
      font-size: 1.05rem;
      line-height: 1.35;
      color: var(--text);
    }
    .success-review p:last-child { margin-bottom: 0; }
    .success-review strong { color: var(--purple-d); }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.5) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
    }
    @media (max-width: 560px) {
      .answers-row { grid-template-columns: 1fr; }
      .pick-board { padding: 18px 12px 24px; }
      .question-box { grid-template-columns: 1fr 52px; }
      .question-visual { grid-column: 1 / -1; width: 100%; height: 170px; }
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:10%; left:4%;">✅</span>
    <span style="top:75%; left:93%;">⚽</span>
  </div>

  <div class="page">
    <a class="back-link" href="../index.html?week=4">⬅️ All Games</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../../assets/images/ui/game-pick.webp" alt="">Pick the Right One</h1>
      <p class="subtitle">Listen to the question, then pick the best answer!</p>
    </header>

    <div class="game-toolbar">
      <button class="pill-btn orange" id="new-question" type="button">🔄 New Question</button>
    </div>

    <section class="pick-board">
      <div class="question-box">
        <img class="question-visual" id="question-visual" src="" alt="">
        <p class="question-text" id="question-text"></p>
        <button class="listen-btn" id="question-listen" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <div class="answers-row" id="answers-row"></div>
    </section>
  </div>

  <div class="success-modal" id="success-modal" role="dialog" aria-modal="true"
       aria-labelledby="success-title" hidden>
    <div class="success-card">
      <h2 class="success-title" id="success-title">Correct! 🎉</h2>
      <div class="success-review">
        <p><strong>Question:</strong> <span id="review-question"></span></p>
        <p><strong>Answer:</strong> <span id="review-answer"></span></p>
      </div>
      <button class="pill-btn green" id="continue-btn" type="button">✓ Continue</button>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script>
    const imageRoot = '../../assets/images/week-4/games/pick-right/';
    const continentImageRoot = '../../assets/images/week-4/games/continents/';
    const ANSWERS = {
      fourYears: {id:'fourYears',text:'Every four years.',image:`${imageRoot}q1-four-years.jpg`,imageAlt:'Four calendar pages forming a clockwise cycle from one to four with the fourth year highlighted'},
      worldwide: {id:'worldwide',text:'They come from all over the world.',image:`${imageRoot}q2-worldwide.webp`,imageAlt:'Child athletes from around the world traveling to a sports stadium'},
      europe: {id:'europe',text:'They come from Europe.',image:`${continentImageRoot}europe.webp`,imageAlt:'Map of Europe with famous landmarks'},
      northAmerica: {id:'northAmerica',text:'They come from North America.',image:`${continentImageRoot}north-america.webp`,imageAlt:'Pink map of North America with famous landmarks'},
      southAmerica: {id:'southAmerica',text:'They come from South America.',image:`${continentImageRoot}south-america.webp`,imageAlt:'Red map of South America with famous landmarks'},
      asia: {id:'asia',text:'They come from Asia.',image:`${continentImageRoot}asia-color.webp`,imageAlt:'Purple map of Asia with famous landmarks'},
      africa: {id:'africa',text:'They come from Africa.',image:`${continentImageRoot}africa-color.webp`,imageAlt:'Green map of Africa with famous landmarks'},
      oceania: {id:'oceania',text:'They come from Oceania.',image:`${continentImageRoot}oceania.webp`,imageAlt:'Yellow map of Oceania with famous landmarks'},
      antarctica: {id:'antarctica',text:'They come from Antarctica.',image:`${continentImageRoot}antarctica.webp`,imageAlt:'Blue and white map of Antarctica with a penguin and research station'},
      manyCountries: {id:'manyCountries',text:'People from many countries.',image:`${imageRoot}q3-many-countries.webp`,imageAlt:'Many people carrying different flags toward a sports stadium'},
      tryBest: {id:'tryBest',text:"Let's try our best!",image:`${imageRoot}q4-encourage.webp`,imageAlt:'Children encouraging athletes and showing fair play'},
      playFair: {id:'playFair',text:"Let's play fair!",image:`${imageRoot}q4-encourage.webp`,imageAlt:'Children encouraging athletes and showing fair play'},
      beKind: {id:'beKind',text:'Be kind to everyone.',image:`${imageRoot}q4-encourage.webp`,imageAlt:'Children encouraging athletes and showing fair play'},
      goodLuck: {id:'goodLuck',text:'Good luck!',image:`${imageRoot}q4-encourage.webp`,imageAlt:'Children encouraging athletes and showing fair play'}
    };

    const WHERE_ANSWER_IDS = ['worldwide','northAmerica','southAmerica','europe','asia','africa','oceania','antarctica'];
    const ENCOURAGEMENT_ANSWER_IDS = ['tryBest','playFair','beKind','goodLuck'];
    const QUESTION_BANK = [
      {id:'when',question:'When are the Olympic Games?',visual:ANSWERS.fourYears.image,visualAlt:ANSWERS.fourYears.imageAlt,correctIds:['fourYears'],wrongIds:[...WHERE_ANSWER_IDS,'manyCountries',...ENCOURAGEMENT_ANSWER_IDS]},
      {id:'whereFrom',question:'Where do Olympic athletes come from?',visual:ANSWERS.worldwide.image,visualAlt:ANSWERS.worldwide.imageAlt,correctIds:WHERE_ANSWER_IDS,wrongIds:['fourYears','manyCountries',...ENCOURAGEMENT_ANSWER_IDS]},
      {id:'who',question:'Who goes to the Olympic Games?',visual:ANSWERS.manyCountries.image,visualAlt:ANSWERS.manyCountries.imageAlt,correctIds:['manyCountries'],wrongIds:['fourYears',...WHERE_ANSWER_IDS,...ENCOURAGEMENT_ANSWER_IDS]},
      {id:'say',question:'What do you say to Olympic athletes?',visual:ANSWERS.tryBest.image,visualAlt:ANSWERS.tryBest.imageAlt,correctIds:ENCOURAGEMENT_ANSWER_IDS,wrongIds:['fourYears',...WHERE_ANSWER_IDS,'manyCountries']}
    ];

    const questionText = document.getElementById('question-text');
    const questionVisual = document.getElementById('question-visual');
    const questionListen = document.getElementById('question-listen');
    const answersRow = document.getElementById('answers-row');
    const successModal = document.getElementById('success-modal');
    const reviewQuestion = document.getElementById('review-question');
    const reviewAnswer = document.getElementById('review-answer');
    const continueBtn = document.getElementById('continue-btn');

    let locked = false;
    let currentRound = null;
    let questionQueue = [];
    let usVoice = null;
    let recordedAudio = null;

    const sounds = (() => {
      let ctx = null;
      function audio() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(frequency, start, duration, type = 'sine', volume = .14) {
        const osc = audio().createOscillator();
        const gain = audio().createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain);
        gain.connect(audio().destination);
        osc.start(start);
        osc.stop(start + duration + .02);
      }
      return {
        correct() {
          const now = audio().currentTime;
          tone(523, now, .12, 'sine', .15);
          tone(659, now + .08, .12, 'sine', .15);
          tone(784, now + .16, .2, 'sine', .17);
        },
        wrong() {
          const now = audio().currentTime;
          tone(220, now, .14, 'sawtooth', .07);
          tone(175, now + .1, .18, 'sawtooth', .065);
        }
      };
    })();

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      usVoice = voices.find(v => /^en[-_]US$/i.test(v.lang || '') && /google|samantha|zira|jenny|aria|english/i.test(v.name))
        || voices.find(v => /^en[-_]US$/i.test(v.lang || ''))
        || null;
    }

    if ('speechSynthesis' in window) {
      pickVoice();
      speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }

    function stopAudio() {
      if (recordedAudio) {
        recordedAudio.pause();
        recordedAudio.currentTime = 0;
        recordedAudio = null;
      }
      if ('speechSynthesis' in window) speechSynthesis.cancel();
    }

    function speak(text) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }
        stopAudio();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = .92;
        if (usVoice) utterance.voice = usVoice;
        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();
        speechSynthesis.speak(utterance);
      });
    }

    function playRecorded(src, fallbackText) {
      stopAudio();
      return new Promise(resolve => {
        if (!src) {
          speak(fallbackText).then(resolve);
          return;
        }
        const audio = new Audio(src);
        recordedAudio = audio;
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          if (recordedAudio === audio) recordedAudio = null;
          resolve();
        };
        audio.addEventListener('ended', finish, { once: true });
        audio.addEventListener('error', () => {
          finish();
          speak(fallbackText);
        }, { once: true });
        audio.play().catch(() => {
          finish();
          speak(fallbackText);
        });
      });
    }

    function buildRound() {
      if (!questionQueue.length) questionQueue = shuffle(QUESTION_BANK);
      const item = questionQueue.pop();
      const correctId = item.correctIds[Math.floor(Math.random() * item.correctIds.length)];
      const wrongId = item.wrongIds[Math.floor(Math.random() * item.wrongIds.length)];
      const correct = ANSWERS[correctId];
      return {question:item.question,visual:item.visual,visualAlt:item.visualAlt,correct,wrong:ANSWERS[wrongId]};
    }

    function makeListenButton(label, answer) {
      const btn = document.createElement('button');
      btn.className = 'listen-btn';
      btn.type = 'button';
      btn.textContent = '🔊';
      btn.setAttribute('aria-label', label);
      btn.addEventListener('click', event => {
        event.stopPropagation();
        if (locked) return;
        playRecorded(answer.audio, answer.text);
      });
      return btn;
    }

    function renderRound() {
      locked = false;
      successModal.hidden = true;
      currentRound = buildRound();
      questionText.textContent = currentRound.question;
      questionVisual.src = currentRound.visual;
      questionVisual.alt = currentRound.visualAlt;
      answersRow.innerHTML = '';

      questionListen.onclick = () => {
        if (locked) return;
        playRecorded(currentRound.questionAudio, currentRound.question);
      };

      shuffle([currentRound.correct, currentRound.wrong]).forEach(answer => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer-btn';
        btn.dataset.answer = answer.id;

        const image = document.createElement('img');
        image.className = 'answer-visual';
        image.src = answer.image;
        image.alt = answer.imageAlt;

        const text = document.createElement('span');
        text.className = 'answer-text';
        text.textContent = answer.text;

        btn.appendChild(image);
        btn.appendChild(text);
        btn.appendChild(makeListenButton(`Listen to answer: ${answer.text}`, answer));

        btn.addEventListener('click', () => chooseAnswer(btn, answer));
        answersRow.appendChild(btn);
      });

      setTimeout(() => {
        if (!locked) playRecorded(currentRound.questionAudio, currentRound.question);
      }, 250);
    }

    async function chooseAnswer(button, answer) {
      if (locked) return;
      locked = true;
      answersRow.querySelectorAll('.answer-btn').forEach(btn => btn.disabled = true);

      if (answer.id === currentRound.correct.id) {
        sounds.correct();
        button.classList.add('correct');
        reviewQuestion.textContent = currentRound.question;
        reviewAnswer.textContent = currentRound.correct.text;
        successModal.hidden = false;
        continueBtn.focus();
        questionListen.disabled = true;
        await playRecorded(currentRound.correct.audio, currentRound.correct.text);
      } else {
        sounds.wrong();
        button.classList.add('wrong');
        setTimeout(() => {
          button.classList.remove('wrong');
          answersRow.querySelectorAll('.answer-btn').forEach(btn => btn.disabled = false);
          locked = false;
        }, 650);
      }
    }

    continueBtn.addEventListener('click', () => {
      stopAudio();
      questionListen.disabled = false;
      renderRound();
    });
    document.getElementById('new-question').addEventListener('click', () => {
      stopAudio();
      questionListen.disabled = false;
      renderRound();
    });
    renderRound();
  </script>
</body>
</html>
