<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Wheel 🎡 — Athlete</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { overflow-x: hidden; }
    .page {
      min-height: 100vh;
      min-height: 100svh;
      height: auto;
      padding-top: 18px;
      padding-bottom: 12px;
    }
    .wheel-wrap {
      position: relative;
      width: min(400px, 55vh, 88vw);
      margin: 18px auto 0;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 38px solid var(--pink-d);
      z-index: 3;
      filter: drop-shadow(0 5px 2px rgba(120,35,35,.32));
    }

    #wheel {
      position: relative;
      container-type: inline-size;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 14px solid var(--white);
      box-shadow: inset 0 0 0 8px rgba(255,255,255,.35), inset 0 -14px 22px rgba(30,58,95,.15), 0 12px 0 #a9d9ec, 0 22px 34px rgba(30,58,95,.22);
      will-change: transform;
    }
    #wheel::after {
      content: '⚽';
      position: absolute;
      inset: 50% auto auto 50%;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      transform: translate(-50%, -50%);
      border: 7px solid var(--white);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 24%, #fff7b0, var(--yellow) 42%, #f09d00 100%);
      color: var(--white);
      font-size: 2rem;
      box-shadow: inset 0 6px 8px rgba(255,255,255,.55), inset 0 -8px 10px rgba(184,107,0,.2), 0 7px 0 #c57d00, 0 12px 16px rgba(30,58,95,.25);
    }
    .wheel-label {
      position: absolute;
      top: var(--label-y);
      left: var(--label-x);
      width: 24%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .wheel-label img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 3px rgba(30,58,95,.3));
    }

    #result {
      margin-top: 12px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--pink-d);
      min-height: 2.1rem;
    }
    .wheel-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 4px;
      min-height: 64px;
    }
    .wheel-action-btn {
      min-width: 190px;
      padding: 16px 44px;
      font-size: 1.4rem;
    }
    body.wheel-is-spinning .wheel-actions {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 90;
      width: min(330px, 92vw);
      min-height: 0;
      margin: 0;
      padding: 8px;
      transform: translateX(-50%);
      border: 4px solid rgba(255,255,255,.95);
      border-radius: 999px;
      background: rgba(235,249,255,.97);
      box-shadow: 0 10px 26px rgba(30,58,95,.28);
      backdrop-filter: blur(8px);
    }
    body.wheel-is-spinning .wheel-action-btn {
      width: 100%;
    }
    .stop-btn {
      background: linear-gradient(180deg, #ff6f6f, #d94343);
      box-shadow: 0 5px 0 #a62929;
    }
    .wheel-action-btn[hidden] { display: none; }
    .pill-btn:disabled {
      cursor: not-allowed;
      filter: grayscale(.35);
      opacity: .6;
      transform: none;
    }
    .selected-area {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      margin: 0;
      background: rgba(65, 45, 86, .42);
      backdrop-filter: blur(3px);
    }
    .selected-area[hidden] { display: none; }
    .flip-hint {
      padding: 9px 20px;
      border-radius: 999px;
      background: var(--white);
      color: var(--purple-d);
      font-family: var(--font-friendly);
      font-weight: 600;
      box-shadow: 0 4px 0 rgba(74,59,82,.14);
    }
    .word-card {
      display: block;
      width: min(330px, 86vw);
      height: min(350px, 62vh);
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 28px;
      background: transparent;
      cursor: pointer;
      perspective: 1100px;
    }
    .selected-area:not([hidden]) .word-card {
      animation: card-pop .55s cubic-bezier(.34, 1.56, .64, 1);
    }
    .word-card:focus-visible {
      outline: 5px solid var(--yellow);
      outline-offset: 5px;
    }
    .card-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transition: transform .65s cubic-bezier(.2,.75,.25,1);
      transform-style: preserve-3d;
    }
    .word-card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 22px;
      border: 8px solid var(--selected-color, var(--purple));
      border-radius: 28px;
      background: radial-gradient(circle at 35% 18%, #fff, #eef9ff 78%);
      box-shadow: inset 0 -10px 18px rgba(30,111,217,.08), 0 10px 0 rgba(30,111,217,.2), 0 20px 34px rgba(30,58,95,.22);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back { transform: rotateY(180deg); }
    .card-face img {
      width: 100%;
      height: min(230px, 65%);
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 12px 7px rgba(30,58,95,.2));
    }
    .card-emoji {
      display: none;
      font-size: clamp(4rem, 18vw, 6rem);
      line-height: 1;
      filter: drop-shadow(0 6px 4px rgba(30,58,95,.14));
    }
    .card-face.show-emoji .card-emoji { display: block; }
    .card-face.show-emoji img { display: none; }
    .card-front img { height: 100%; }
    .card-front .card-word { display: none; }
    .card-back img { height: min(205px, 62%); }
    .card-word {
      color: var(--pink-d);
      font-size: 1.9rem;
      font-weight: 800;
      text-transform: capitalize;
    }
    .card-sentence {
      color: var(--text);
      font-family: var(--font-friendly);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .return-btn {
      background: linear-gradient(180deg, var(--blue), var(--blue-d));
      box-shadow: 0 5px 0 #1b7fae;
    }
    @keyframes card-pop {
      from { opacity: 0; transform: translateY(35px) scale(.55) rotate(-5deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card-inner { transition: none; }
      .selected-area:not([hidden]) .word-card { animation: none; }
    }
    @media (max-width: 480px) {
      .page { padding-top: 12px; }
      .wheel-wrap { width: min(330px, 46svh, 91vw); margin-top: 12px; }
      #wheel::after { width: 62px; height: 62px; }
      .wheel-action-btn { min-width: min(230px, 78vw); padding: 12px 28px; font-size: 1.15rem; }
      .word-card { height: min(325px, 60vh); }
      .card-face { padding: 16px; }
      .card-sentence { font-size: 1.1rem; }
    }
    @media (max-height: 650px) {
      .page { padding-top: 7px; }
      header { margin-top: 6px !important; }
      header .big-title { font-size: 1.65rem !important; }
      header .subtitle { margin-top: 3px; font-size: .86rem; line-height: 1.15; }
      .wheel-wrap { width: min(280px, 43svh, 82vw); margin-top: 8px; }
      #result { margin-top: 6px; min-height: 1.5rem; font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:10%; left:4%;">🎡</span>
    <span style="top:75%; left:93%;">⭐</span>
  </div>

  <div class="page center">
    <div style="text-align:left;"><a class="back-link" href="index.html?week=1">⬅️ All Games</a></div>

    <header style="margin-top:16px;">
      <h1 class="big-title page-title-with-icon" style="font-size:2.4rem;"><img class="page-title-icon" src="../assets/images/ui/game-wheel.webp" alt="">Spin the Wheel</h1>
      <p class="subtitle">Spin slowly, press stop, then flip your picture card!</p>
    </header>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div id="wheel"></div>
    </div>

    <div id="result"></div>

    <div class="wheel-actions">
      <button class="pill-btn wheel-action-btn" id="spin-btn">🎡 SPIN!</button>
      <button class="pill-btn wheel-action-btn stop-btn" id="stop-btn" hidden>🛑 STOP!</button>
    </div>

    <section class="selected-area" id="selected-area" role="dialog" aria-modal="true"
             aria-label="Selected word card" aria-live="polite" hidden>
      <p class="flip-hint">👆 Click the card to flip it!</p>
      <button class="word-card" id="word-card" type="button" aria-pressed="false">
        <span class="card-inner">
          <span class="card-face card-front">
            <img id="front-image" src="" alt="">
            <span class="card-emoji" id="front-emoji" aria-hidden="true"></span>
            <span class="card-word" id="card-word"></span>
          </span>
          <span class="card-face card-back">
            <img id="back-image" src="" alt="">
            <span class="card-emoji" id="back-emoji" aria-hidden="true"></span>
            <span class="card-sentence" id="card-sentence"></span>
          </span>
        </span>
      </button>
      <button class="pill-btn return-btn" id="return-btn" type="button">🎡 Back to Wheel</button>
    </section>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const SEGMENTS = [
      { word: 'soccer',   color: '#7ed957', sentence: 'I play soccer.',     emoji: '⚽', image: '../assets/images/week-1/memory/soccer.webp' },
      { word: 'baseball', color: '#b388ff', sentence: 'I play baseball.',   emoji: '⚾', image: '../assets/images/week-1/memory/baseball.webp' },
      { word: 'tennis',   color: '#ffa62b', sentence: 'I play tennis.',     emoji: '🎾', image: '../assets/images/week-1/memory/tennis.webp' },
      { word: 'golf',     color: '#ff8f66', sentence: 'I play golf.',       emoji: '⛳', image: '../assets/images/week-1/memory/golf.webp' },
      { word: 'athlete',  color: '#2ec4b6', sentence: 'I am an athlete.',   emoji: '🏃', image: '../assets/images/week-1/memory/athlete.webp' }
    ];

    const wheel = document.getElementById('wheel');
    const resultEl = document.getElementById('result');
    const spinBtn = document.getElementById('spin-btn');
    const stopBtn = document.getElementById('stop-btn');
    const selectedArea = document.getElementById('selected-area');
    const wordCard = document.getElementById('word-card');
    const returnBtn = document.getElementById('return-btn');
    const frontImage = document.getElementById('front-image');
    const backImage = document.getElementById('back-image');
    const frontEmoji = document.getElementById('front-emoji');
    const backEmoji = document.getElementById('back-emoji');
    const cardWord = document.getElementById('card-word');
    const cardSentence = document.getElementById('card-sentence');
    const SPIN_SPEED = 75;
    const SEGMENT_ANGLE = 360 / SEGMENTS.length;
    let rotation = 0;
    let spinning = false;
    let stopping = false;
    let animationFrame = null;
    let lastFrameTime = 0;
    let currentSegment = null;
    let usVoice = null;

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      usVoice = voices.find(v => /^en[-_]US$/i.test(v.lang || '') && /google|samantha|zira|jenny|aria|english/i.test(v.name))
        || voices.find(v => /^en[-_]US$/i.test(v.lang || ''))
        || null;
    }

    if ('speechSynthesis' in window) {
      pickVoice();
      speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }

    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = .92;
      if (usVoice) utterance.voice = usVoice;
      speechSynthesis.speak(utterance);
    }
    function narrateResult(segment){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(segment.word);u.lang='en-US';u.rate=.9;if(usVoice)u.voice=usVoice;u.onend=()=>setTimeout(()=>{wordCard.classList.add('flipped');wordCard.setAttribute('aria-pressed','true');speak(segment.sentence)},350);speechSynthesis.speak(u)}

    wheel.style.background = `conic-gradient(${SEGMENTS.map((segment, index) => {
      const start = index * SEGMENT_ANGLE;
      const end = (index + 1) * SEGMENT_ANGLE;
      return `${segment.color} ${start}deg ${end}deg`;
    }).join(', ')})`;

    SEGMENTS.forEach((segment, index) => {
      const label = document.createElement('span');
      const angle = (index * SEGMENT_ANGLE + SEGMENT_ANGLE / 2) * Math.PI / 180;
      label.className = 'wheel-label';
      const image = document.createElement('img');
      image.src = segment.image;
      image.alt = '';
      image.setAttribute('aria-hidden', 'true');
      label.appendChild(image);
      label.style.setProperty('--label-x', `${50 + Math.sin(angle) * 30}%`);
      label.style.setProperty('--label-y', `${50 - Math.cos(angle) * 30}%`);
      wheel.appendChild(label);
    });

    function setCardImage(img, emojiEl, faceEl, segment) {
      faceEl.classList.remove('show-emoji');
      emojiEl.textContent = segment.emoji;
      img.alt = segment.word;
      img.onerror = () => {
        faceEl.classList.add('show-emoji');
      };
      img.src = segment.image;
    }

    function renderWheel() {
      wheel.style.transform = `rotate(${rotation}deg)`;
    }

    function spinFrame(time) {
      if (!spinning || stopping) return;
      if (!lastFrameTime) lastFrameTime = time;
      const elapsed = Math.min(time - lastFrameTime, 40);
      lastFrameTime = time;
      rotation += SPIN_SPEED * elapsed / 1000;
      renderWheel();
      animationFrame = requestAnimationFrame(spinFrame);
    }

    function showSelectedCard(segment) {
      currentSegment = segment;
      resultEl.textContent = `🎉 You landed on ${segment.word}!`;
      setCardImage(frontImage, frontEmoji, frontImage.parentElement, segment);
      setCardImage(backImage, backEmoji, backImage.parentElement, segment);
      cardWord.textContent = segment.word;
      cardSentence.textContent = segment.sentence;
      wordCard.style.setProperty('--selected-color', segment.color);
      wordCard.classList.remove('flipped');
      wordCard.setAttribute('aria-pressed', 'false');
      wordCard.setAttribute('aria-label', `${segment.word} picture card. Click to reveal the sentence.`);
      selectedArea.hidden = false;
      wordCard.focus();
      showToast(`🎉 ${segment.word}!`);
      narrateResult(segment);
    }

    function finishSpin() {
      const normalizedRotation = ((rotation % 360) + 360) % 360;
      const pointerAngle = (360 - normalizedRotation) % 360;
      const index = Math.floor(pointerAngle / SEGMENT_ANGLE) % SEGMENTS.length;
      spinning = false;
      stopping = false;
      document.body.classList.remove('wheel-is-spinning');
      stopBtn.hidden = true;
      stopBtn.disabled = false;
      spinBtn.hidden = false;
      spinBtn.disabled = false;
      showSelectedCard(SEGMENTS[index]);
    }

    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      stopping = false;
      lastFrameTime = 0;
      currentSegment = null;
      resultEl.textContent = '';
      selectedArea.hidden = true;
      spinBtn.disabled = true;
      spinBtn.hidden = true;
      stopBtn.hidden = false;
      document.body.classList.add('wheel-is-spinning');
      requestAnimationFrame(() => stopBtn.focus({ preventScroll: true }));
      animationFrame = requestAnimationFrame(spinFrame);
    });

    stopBtn.addEventListener('click', () => {
      if (!spinning || stopping) return;
      stopping = true;
      stopBtn.disabled = true;
      cancelAnimationFrame(animationFrame);

      const startRotation = rotation;
      const startTime = performance.now();
      const duration = 1800;
      const coastDistance = SPIN_SPEED * (duration / 1000) / 2;

      function slowDown(time) {
        const progress = Math.min((time - startTime) / duration, 1);
        rotation = startRotation + coastDistance * (2 * progress - progress * progress);
        renderWheel();
        if (progress < 1) {
          animationFrame = requestAnimationFrame(slowDown);
        } else {
          finishSpin();
        }
      }
      animationFrame = requestAnimationFrame(slowDown);
    });

    wordCard.addEventListener('click', () => {
      const flipped = wordCard.classList.toggle('flipped');
      wordCard.setAttribute('aria-pressed', String(flipped));
      wordCard.setAttribute(
        'aria-label',
        flipped ? `${cardSentence.textContent} Click to see the word card again.` : `${cardWord.textContent} picture card. Click to reveal the sentence.`
      );
      if (flipped && currentSegment) speak(currentSegment.sentence);
      else if (!flipped && currentSegment) speak(currentSegment.word);
    });

    returnBtn.addEventListener('click', () => {
      selectedArea.hidden = true;
      currentSegment = null;
      speechSynthesis.cancel();
      spinBtn.focus();
    });
  </script>
</body>
</html>
